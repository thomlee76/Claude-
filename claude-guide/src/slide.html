<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:K;src:local('Noto Sans CJK KR'),local('NanumGothic');}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden}
body{font-family:'Noto Sans CJK KR','Noto Sans KR','NanumGothic',sans-serif;background:#F1F4F7;color:#131C24;position:relative}
.top{position:absolute;left:64px;right:64px;top:40px;display:flex;align-items:center;gap:14px;font-size:17px;color:#6D7C8A;letter-spacing:.02em}
.mark{width:34px;height:34px;border-radius:9px;background:#DC4A1E;color:#fff;display:grid;place-items:center;font-size:20px}
.top .ch{color:#A9350F;font-weight:700}
.top .no{margin-left:auto;font-variant-numeric:tabular-nums}
.body{position:absolute;left:64px;right:64px;top:108px;bottom:70px;display:flex;flex-direction:column}
h1{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin-bottom:30px;padding-bottom:18px;border-bottom:3px solid #131C24}
ul.b{list-style:none;display:flex;flex-direction:column;gap:20px}
ul.b li{font-size:29px;line-height:1.45;padding-left:34px;position:relative;color:#2B3A47}
ul.b li::before{content:'';position:absolute;left:4px;top:15px;width:12px;height:12px;border-radius:3px;background:#DC4A1E}
ol.s{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:18px}
ol.s li{counter-increment:s;font-size:29px;line-height:1.45;padding-left:58px;position:relative;color:#2B3A47}
ol.s li::before{content:counter(s);position:absolute;left:0;top:2px;width:40px;height:40px;border-radius:50%;background:#DEE7EF;color:#2B4257;font-size:22px;font-weight:700;display:grid;place-items:center}
table{border-collapse:collapse;width:100%;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px -14px rgba(19,28,36,.3)}
th{background:#2B4257;color:#fff;font-size:22px;text-align:left;padding:14px 20px;font-weight:600}
td{font-size:24px;padding:14px 20px;border-top:1px solid #D3DBE3;color:#2B3A47;line-height:1.35}
td:first-child{font-weight:700;color:#131C24}
td.num{text-align:center;font-weight:700}
td.hi{color:#A9350F}
.prompt{background:#FBE7DF;border:2px solid #F0B9A6;border-radius:16px;padding:26px 30px;font-size:27px;line-height:1.6;color:#131C24;white-space:pre-wrap}
.prompt .lb{display:block;font-size:16px;letter-spacing:.14em;color:#A9350F;font-weight:700;margin-bottom:10px}
.pnote{margin-top:22px;font-size:24px;color:#41505E}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.vs .c{background:#fff;border-radius:16px;padding:26px 30px;border:2px solid #D3DBE3}
.vs .c.r{border-color:#DC4A1E}
.vs .c h2{font-size:30px;margin-bottom:18px;color:#2B4257}
.vs .c.r h2{color:#A9350F}
.vs .c ul{list-style:none;display:flex;flex-direction:column;gap:14px}
.vs .c li{font-size:26px;line-height:1.4;color:#2B3A47}
.vs .c li::before{content:'— ';color:#6D7C8A}
.cover{position:absolute;inset:0;background:#131C24;color:#fff;padding:0 96px;display:flex;flex-direction:column;justify-content:center}
.cover .k{font-size:22px;letter-spacing:.2em;color:#FF7A4D;font-weight:700;margin-bottom:22px}
.cover h1{font-size:76px;border:none;margin:0 0 22px;padding:0;color:#fff}
.cover .sub{font-size:30px;color:#A8B6C2}
.cover .mark{position:absolute;left:96px;top:72px;width:56px;height:56px;font-size:34px;border-radius:14px}
.cover .foot{position:absolute;left:96px;bottom:64px;font-size:18px;color:#7B8996}
.end h1{border-color:#DC4A1E}
.end ul.b li{font-size:27px}
.bar{position:absolute;left:0;bottom:0;height:8px;background:#DC4A1E}
.barbg{position:absolute;left:0;right:0;bottom:0;height:8px;background:#DCE3EA}
</style></head><body><div id="root"></div>
<script>
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(S, i, n, chTitle){
  const r=document.getElementById('root'); let h='';
  if(S.k==='cover'){
    h=`<div class="cover"><div class="mark">✳</div><div class="k">${esc(chTitle.split(' · ')[0])}</div><h1>${esc(S.t)}</h1><div class="sub">${esc(S.sub||'')}</div><div class="foot">클로드 실습 가이드 · 영상 강의</div></div>`;
  } else {
    h=`<div class="top"><div class="mark">✳</div><span class="ch">${esc(chTitle)}</span><span class="no">${i} / ${n-1}</span></div><div class="body${S.k==='end'?' end':''}"><h1>${esc(S.t)}</h1>`;
    if(S.k==='list'||S.k==='end') h+='<ul class="b">'+S.b.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';
    else if(S.k==='steps') h+='<ol class="s">'+S.b.map(x=>`<li>${esc(x)}</li>`).join('')+'</ol>';
    else if(S.k==='table'){
      h+='<table><thead><tr>'+S.h.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr></thead><tbody>'+
        S.r.map(row=>'<tr>'+row.map((c,j)=>{const isN=/^\d+(\/10)?$/.test(c);let cls=isN?'num':'';if(isN&&j>0){const vals=row.slice(1).map(Number).filter(x=>!isNaN(x));if(+c===Math.max(...vals))cls+=' hi';}return `<td class="${cls}">${esc(c)}</td>`}).join('')+'</tr>').join('')+'</tbody></table>';
    }
    else if(S.k==='prompt'){ h+=`<div class="prompt"><span class="lb">PROMPT · 이렇게 입력해 보세요</span>${esc(S.p)}</div>`; if(S.b) h+=S.b.map(x=>`<div class="pnote">→ ${esc(x)}</div>`).join(''); }
    else if(S.k==='vs'){ const c=(o,cl)=>`<div class="c ${cl}"><h2>${esc(o.h)}</h2><ul>${o.b.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`; h+=`<div class="vs">${c(S.l,S.hl==='l'?'r':'')}${c(S.r,S.hl==='l'?'':'r')}</div>`; }
    h+='</div>';
  }
  h+=`<div class="barbg"></div><div class="bar" style="width:${(i/(n-1)*100).toFixed(2)}%"></div>`;
  r.innerHTML=h;
}
</script></body></html>
