<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>클로드 실습 가이드</title>
<meta name="description" content="해외영업 실무자를 위한 클로드 실습 가이드 — 14개 레슨과 장별 10분 영상 강의, 오프라인 사용 가능">
<meta name="theme-color" content="#DC4A1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="클로드 가이드">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/*CSS*/
/* ---------- additions: video lessons, offline ---------- */
body{padding-bottom:env(safe-area-inset-bottom)}
.vwrap{background:#0F151B;border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.vwrap video{display:block;width:100%;aspect-ratio:16/9;background:#0F151B}
.vbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.vbtn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--ink2);font-family:var(--body)}
.vbtn:hover{border-color:var(--accent);color:var(--ink)}
.vbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.vbtn.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.vstat{font-size:12.5px;color:var(--ink3);margin-left:auto}
.marks{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.marks .mh{padding:10px 15px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2)}
.marks button{display:flex;gap:12px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:10px 15px;cursor:pointer;font-size:14px;color:var(--ink2);font-family:var(--body)}
.marks button:last-child{border-bottom:none}
.marks button:hover{background:var(--surface2);color:var(--ink)}
.marks button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.marks .tm{font-family:var(--mono);font-size:12px;color:var(--ink3);width:44px;flex:none;padding-top:2px}
.toc a.vid .idx{color:var(--accent)}
.tab.vid .n::before{content:'▶ ';font-size:11px}
.offline{padding:12px 22px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.offline .row{display:flex;gap:8px;align-items:center}
.offline .lbl{font-size:12px;color:var(--ink2);line-height:1.45}
.offline .lbl b{color:var(--ink)}
.offline button{margin-left:auto;flex:none;background:var(--accent);color:#fff;border:none;border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:var(--body)}
.offline button.ok{background:var(--good-soft);color:var(--good)}
.offline .pbar{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;display:none}
.offline .pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.about{font-size:12.5px;color:var(--ink3);line-height:1.7;margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <div class="mark">✳</div>
      <div class="kicker">14 Lessons · 4 Videos · Offline</div>
      <h1>클로드 실습 가이드</h1>
      <div class="sub">해외영업 실무 예시로 익히는 화면 구성, 질문법, 프로젝트·스킬, 바이브 코딩</div>
    </div>
    <div class="progwrap">
      <svg class="ring" viewBox="0 0 46 46" aria-hidden="true">
        <circle class="bg" cx="23" cy="23" r="19"></circle>
        <circle class="fg" id="ringfg" cx="23" cy="23" r="19" transform="rotate(-90 23 23)"></circle>
        <text id="ringtx" x="23" y="27" text-anchor="middle">0%</text>
      </svg>
      <div class="proglabel"><b id="progn">0 / 0 레슨</b><span id="progq">퀴즈 0문항 정답</span></div>
      <button class="reset" id="resetbtn" title="진도 초기화">초기화</button>
    </div>
    <div class="offline" id="offline">
      <div class="row"><div class="lbl" id="offlbl"><b>오프라인 영상</b><br>확인 중…</div><button id="offbtn" type="button">전체 저장</button></div>
      <div class="pbar" id="offbar"><i></i></div>
    </div>
    <nav class="toc" id="toc"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="head">
      <div class="topbar">
        <button class="menubtn" id="menubtn" aria-label="목차 열기">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
        </button>
        <div class="crumb" id="crumb"></div>
        <div class="tb-actions">
          <div class="mprog" title="진도율">
            <svg viewBox="0 0 22 22" aria-hidden="true">
              <circle class="bg" cx="11" cy="11" r="8"></circle>
              <circle class="fg" id="mringfg" cx="11" cy="11" r="8" transform="rotate(-90 11 11)"></circle>
            </svg><span id="mpct">0%</span>
          </div>
          <button class="tbtn" id="searchbtn">🔍 <span class="lbl">검색 <kbd>/</kbd></span></button>
          <button class="tbtn" id="themebtn" title="라이트/다크 전환">◐</button>
        </div>
      </div>
      <div class="strip">
        <div class="grp" id="grp"></div>
        <div class="tabs" id="tabs"></div>
      </div>
    </div>
    <div class="page" id="page"></div>
  </main>
</div>

<div class="ovl" id="ovl">
  <div class="searchbox">
    <input id="sinput" type="search" placeholder="전체에서 검색… (예: 메모리, 스킬, 계약서, GitHub)" autocomplete="off">
    <div class="results" id="results"></div>
  </div>
</div>

</body></html>
