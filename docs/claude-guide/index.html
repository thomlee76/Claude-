<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>클로드 실습 가이드</title>
<meta name="description" content="해외영업 실무자를 위한 클로드 실습 가이드 — 14개 레슨과 장별 10분 영상 강의, 오프라인 사용 가능">
<meta name="theme-color" content="#DC4A1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="클로드 가이드">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

:root{
  --paper:#F1F4F7; --surface:#FFFFFF; --surface2:#E7ECF1; --sunk:#DCE3EA;
  --ink:#131C24; --ink2:#41505E; --ink3:#6D7C8A;
  --line:#D3DBE3; --line-strong:#B8C4CF;
  --accent:#DC4A1E; --accent-ink:#A9350F; --accent-soft:#FBE7DF;
  --slate:#2B4257; --slate-soft:#DEE7EF;
  --good:#1B7A5A; --good-soft:#DCF0E8;
  --warn:#8A5A00; --warn-soft:#FBEFD6;
  --shadow:0 1px 2px rgba(19,28,36,.06), 0 8px 24px -12px rgba(19,28,36,.18);
  --display:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono','Noto Sans KR',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F151B; --surface:#171F27; --surface2:#1F2932; --sunk:#131A21;
    --ink:#E7EDF3; --ink2:#A8B6C2; --ink3:#7B8996;
    --line:#2A3540; --line-strong:#3B4956;
    --accent:#FF7A4D; --accent-ink:#FFA483; --accent-soft:#37201A;
    --slate:#93B3CE; --slate-soft:#1D2A36;
    --good:#5BC49B; --good-soft:#16281F;
    --warn:#E0B15C; --warn-soft:#2A2113;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#0F151B; --surface:#171F27; --surface2:#1F2932; --sunk:#131A21;
  --ink:#E7EDF3; --ink2:#A8B6C2; --ink3:#7B8996;
  --line:#2A3540; --line-strong:#3B4956;
  --accent:#FF7A4D; --accent-ink:#FFA483; --accent-soft:#37201A;
  --slate:#93B3CE; --slate-soft:#1D2A36;
  --good:#5BC49B; --good-soft:#16281F;
  --warn:#E0B15C; --warn-soft:#2A2113;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:296px minmax(0,1fr); min-height:100vh}
.scrim{display:none}
h1,h2,h3,h4{word-break:keep-all}
.side{
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.brand{padding:22px 22px 16px; border-bottom:1px solid var(--line)}
.mark{
  width:40px; height:40px; border-radius:11px; background:var(--accent); color:#fff; display:grid; place-items:center;
  font-size:24px; line-height:1; margin-bottom:12px; box-shadow:0 6px 16px -8px color-mix(in srgb, var(--accent) 70%, transparent);
}
.mark.sm{width:26px; height:26px; border-radius:7px; font-size:15px; margin:0; flex:none; box-shadow:none}
.brand .kicker{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--accent); margin-bottom:6px;
}
.brand h1{
  font-family:var(--display); font-weight:900; font-size:21px; line-height:1.3;
  margin:0 0 4px; letter-spacing:-.01em; text-wrap:balance;
}
.brand .sub{font-size:11.5px; color:var(--ink3); line-height:1.5}

.progwrap{padding:14px 22px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center}
.ring{width:46px; height:46px; flex:none}
.ring circle{fill:none; stroke-width:5}
.ring .bg{stroke:var(--sunk)}
.ring .fg{stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .5s ease}
.ring text{font-family:var(--mono); font-size:11px; fill:var(--ink); font-weight:500}
.proglabel{font-size:12px; color:var(--ink2); line-height:1.45}
.proglabel b{display:block; font-size:12.5px; color:var(--ink); font-weight:600}
.reset{
  margin-left:auto; background:none; border:1px solid var(--line); border-radius:5px;
  font-size:10.5px; color:var(--ink3); padding:3px 7px; cursor:pointer;
}
.reset:hover{border-color:var(--line-strong); color:var(--ink2)}

.toc{overflow-y:auto; flex:1; padding:8px 0 40px}
.toc-part{padding:16px 22px 5px; display:flex; align-items:baseline; gap:8px}
.toc-part .num{font-family:var(--display); font-weight:900; font-size:16px; color:var(--accent); line-height:1; white-space:nowrap; flex:none}
.toc-part .ttl{font-size:11px; letter-spacing:.06em; color:var(--ink3); font-weight:600}
.toc a{
  display:flex; gap:9px; align-items:flex-start; padding:7px 22px 7px 20px;
  text-decoration:none; color:var(--ink2); font-size:13.5px; line-height:1.45;
  border-left:2px solid transparent;
}
.toc a:hover{background:var(--surface2); color:var(--ink)}
.toc a.on{border-left-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.toc a .idx{font-family:var(--mono); font-size:11px; color:var(--ink3); padding-top:2px; flex:none; width:18px}
.toc a.on .idx{color:var(--accent)}
.toc a .dot{
  margin-left:auto; width:14px; height:14px; flex:none; border-radius:50%; margin-top:3px;
  border:1.5px solid var(--line-strong);
}
.toc a.done .dot{background:var(--good); border-color:var(--good); position:relative}
.toc a.done .dot::after{
  content:''; position:absolute; left:4px; top:1.5px; width:4px; height:7px;
  border:solid #fff; border-width:0 1.7px 1.7px 0; transform:rotate(42deg);
}

/* ---------- main ---------- */
.main{min-width:0; display:flex; flex-direction:column}
.head{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.topbar{
  display:flex; align-items:center; gap:10px; padding:10px 30px; border-bottom:1px solid var(--line);
}
.mprog{display:none; align-items:center; gap:5px; font-family:var(--mono); font-size:11px; color:var(--ink2)}
.mprog svg{width:22px; height:22px}
.mprog circle{fill:none; stroke-width:4}
.mprog .bg{stroke:var(--sunk)}
.mprog .fg{stroke:var(--accent); stroke-linecap:round}

/* ---------- lesson tab strip ---------- */
.strip{position:relative; padding:0 30px}
.grp{
  display:flex; gap:4px; padding:8px 0 0; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em;
  color:var(--ink3); overflow-x:auto; scrollbar-width:none; white-space:nowrap;
}
.grp::-webkit-scrollbar{display:none}
.grp button{
  background:none; border:none; padding:2px 4px; cursor:pointer; font:inherit; color:inherit; letter-spacing:inherit;
  border-radius:4px;
}
.grp button:hover{color:var(--ink)}
.grp button.on{color:var(--accent); font-weight:600}
.grp .sep{padding:2px 0}
.tabs{display:flex; gap:10px; padding:4px 0 10px; overflow-x:auto; scrollbar-width:none; scroll-behavior:smooth}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none; width:118px; background:var(--paper); border:1px solid var(--line); border-radius:12px;
  padding:8px 10px; position:relative; text-decoration:none; color:var(--ink2); transition:border-color .15s;
}
.tab:hover{border-color:var(--accent)}
.tab .n{font-family:var(--mono); font-size:15px; font-weight:500; letter-spacing:.05em; color:var(--ink2); line-height:1.2}
.tab .t{font-size:11.5px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink2)}
.tab.on{background:var(--accent); border-color:var(--accent)}
.tab.on .n,.tab.on .t{color:#fff}
.tab.done::after{
  content:'✓'; position:absolute; right:7px; top:7px; width:15px; height:15px; border-radius:50%;
  background:var(--good); color:#fff; font-size:9px; display:grid; place-items:center;
}
.tab.on.done::after{background:#fff; color:var(--accent)}
.tgrp{
  flex:none; display:flex; gap:8px; align-items:stretch; position:relative;
  padding:16px 8px 8px; margin-top:8px; border:1.5px solid var(--line-strong); border-radius:14px; background:var(--surface2);
}
.tgrp.cur{border-color:var(--accent); background:var(--accent-soft)}
.tlab{
  position:absolute; left:10px; top:-10px; display:flex; gap:6px; align-items:center;
  background:var(--slate); color:#fff; font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:6px; white-space:nowrap;
}
.tlab .cnt{font-family:var(--mono); font-size:9.5px; opacity:.8; font-weight:400}
.tgrp.cur .tlab{background:var(--accent)}
.tgrp .tab{background:var(--surface)}
.tgrp .tab.on{background:var(--accent)}
.pagenav a.chg{border-color:var(--accent); background:var(--accent-soft)}
.pagenav a.chg .dir{color:var(--accent-ink); font-weight:600}
.pagenav a.chg .tt{color:var(--accent-ink)}
.strip::after{
  content:''; position:absolute; right:0; top:0; bottom:0; width:48px; pointer-events:none;
  background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface) 92%, transparent));
}
.menubtn{display:none}
.crumb{font-family:var(--mono); font-size:11px; letter-spacing:.05em; color:var(--ink3); min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tb-actions{margin-left:auto; display:flex; gap:8px; align-items:center}
.tbtn{
  background:var(--surface); border:1px solid var(--line); border-radius:7px;
  padding:6px 11px; font-size:12.5px; cursor:pointer; color:var(--ink2); display:flex; gap:6px; align-items:center;
}
.tbtn:hover{border-color:var(--line-strong); color:var(--ink)}
.tbtn kbd{font-family:var(--mono); font-size:10px; border:1px solid var(--line); border-radius:3px; padding:0 3px; color:var(--ink3)}

.page{max-width:840px; width:100%; margin:0 auto; padding:34px 30px 90px}

.lesson-head{margin-bottom:30px; padding-bottom:22px; border-bottom:2px solid var(--ink)}
.lesson-head .eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); margin-bottom:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.lesson-head .eyebrow .pg{color:var(--ink3); letter-spacing:.06em}
.lesson-head h2{
  font-family:var(--display); font-weight:900; font-size:clamp(25px,4.2vw,36px); line-height:1.25;
  margin:0 0 12px; letter-spacing:-.015em; text-wrap:balance;
}
.lesson-head .intro{
  font-size:15px; color:var(--ink2); line-height:1.8; margin:0;
  border-left:3px solid var(--accent); padding-left:15px;
}

.blocks{display:flex; flex-direction:column; gap:22px}
h3.sec{
  font-size:19px; font-weight:700; margin:18px 0 -6px; color:var(--accent-ink);
  letter-spacing:-.01em; display:flex; gap:9px; align-items:baseline;
}
h3.sec::before{content:''; width:7px; height:7px; background:var(--accent); flex:none; border-radius:1px; transform:translateY(-3px)}
h4.sub{font-size:15px; font-weight:600; margin:8px 0 -10px; color:var(--ink)}
p.tx{margin:0; font-size:15.2px; line-height:1.82; color:var(--ink2); max-width:66ch}
p.tx b{color:var(--ink); font-weight:600}

ul.li, ol.li{margin:0; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:9px}
ul.li li{position:relative; padding-left:19px; font-size:14.8px; line-height:1.7; color:var(--ink2); max-width:66ch}
ul.li li::before{content:''; position:absolute; left:4px; top:11px; width:5px; height:5px; border-radius:50%; background:var(--accent)}
ol.li{counter-reset:s}
ol.li li{
  position:relative; padding-left:34px; font-size:14.8px; line-height:1.7; color:var(--ink2);
  counter-increment:s; max-width:66ch;
}
ol.li li::before{
  content:counter(s); position:absolute; left:0; top:2px; width:22px; height:22px; border-radius:50%;
  background:var(--slate-soft); color:var(--slate); font-family:var(--mono); font-size:11px; font-weight:500;
  display:grid; place-items:center;
}
.li li b{color:var(--ink); font-weight:600}

/* UI element list (사이드바/대화창 요소) */
.uilist{display:grid; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.uilist .row{background:var(--surface); padding:12px 15px; display:grid; grid-template-columns:26px 1fr; gap:12px; align-items:start}
.uilist .n{
  font-family:var(--mono); font-size:11px; font-weight:500; color:#fff; background:var(--accent);
  width:21px; height:21px; border-radius:50%; display:grid; place-items:center; margin-top:2px;
}
.uilist .nm{font-weight:600; font-size:14.5px; color:var(--ink); margin-bottom:2px}
.uilist .ds{font-size:13.6px; color:var(--ink2); line-height:1.65}

/* prompt card */
.prompt{
  background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  border-radius:11px; overflow:hidden;
}
.prompt .ph{
  display:flex; align-items:center; gap:8px; padding:8px 13px;
  border-bottom:1px solid color-mix(in srgb, var(--accent) 20%, transparent);
}
.prompt .ph .who{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--accent-ink); font-weight:500;
}
.copy{
  margin-left:auto; background:var(--surface); border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  color:var(--accent-ink); border-radius:6px; font-size:11.5px; padding:3px 9px; cursor:pointer;
  font-family:var(--mono); letter-spacing:.02em;
}
.copy:hover{background:var(--accent); color:#fff; border-color:var(--accent)}
.copy.ok{background:var(--good); border-color:var(--good); color:#fff}
.prompt pre{
  margin:0; padding:13px 15px; font-family:var(--body); font-size:14.4px; line-height:1.75;
  color:var(--ink); white-space:pre-wrap; word-break:break-word;
}

/* claude output */
.output{
  background:var(--surface); border:1px solid var(--line); border-radius:11px; box-shadow:var(--shadow);
  overflow:hidden;
}
.output .oh{
  padding:8px 14px; border-bottom:1px solid var(--line); background:var(--surface2);
  font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink3);
  display:flex; gap:8px; align-items:center;
}
.output .oh .star{color:var(--accent); font-size:12px}
.output .ob{padding:15px 17px; font-size:14.5px; line-height:1.8; color:var(--ink2); white-space:pre-wrap}
.output .ob strong{color:var(--ink)}

/* claude output: collapse + trimmed marker */
.output .ob.clamp{max-height:300px; overflow:hidden; position:relative}
.output .ob.clamp::after{content:''; position:absolute; left:0; right:0; bottom:0; height:80px;
  background:linear-gradient(180deg, transparent, var(--surface))}
.output .more{
  display:block; width:100%; background:var(--surface2); border:none; border-top:1px solid var(--line);
  padding:9px; font-size:12.5px; color:var(--accent-ink); cursor:pointer; font-weight:600;
}
.output .more:hover{background:var(--accent-soft)}
.output .trim{
  display:flex; gap:8px; align-items:center; padding:8px 14px; border-top:1px dashed var(--line);
  font-size:12px; color:var(--ink3); background:var(--paper);
}
.output .trim b{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--warn);
  border:1px solid var(--warn); border-radius:4px; padding:1px 6px; font-weight:500}

/* tip / note */
.tip{
  display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start;
  background:var(--warn-soft); border-left:3px solid var(--warn); border-radius:0 9px 9px 0; padding:12px 15px;
}
.tip .lb{
  font-family:var(--mono); font-size:10px; letter-spacing:.1em; font-weight:500;
  background:var(--warn); color:#fff; padding:2px 7px; border-radius:4px; margin-top:3px;
}
:root[data-theme="dark"] .tip .lb, :root:not([data-theme="light"]) .tip .lb{color:#1B1408}
.tip p{margin:0; font-size:14px; line-height:1.7; color:var(--ink2)}

.summary{
  background:var(--surface); border:1px solid var(--accent); border-radius:12px; padding:18px 20px;
  box-shadow:var(--shadow);
}
.summary .st{
  font-family:var(--display); font-weight:700; font-size:16px; color:var(--accent-ink);
  margin:0 0 12px; letter-spacing:-.01em;
}
.summary ul{margin:0; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:10px}
.summary li{position:relative; padding-left:19px; font-size:14.6px; line-height:1.72; color:var(--ink2)}
.summary li::before{content:''; position:absolute; left:3px; top:10px; width:6px; height:6px; border-radius:50%; background:var(--accent)}

/* tables */
.tblwrap{border:1px solid var(--line); border-radius:11px; overflow:hidden; background:var(--surface)}
.tblcap{
  padding:10px 15px; border-bottom:1px solid var(--line); background:var(--surface2);
  font-size:12.5px; font-weight:600; color:var(--ink2); display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.tblcap input{
  margin-left:auto; background:var(--surface); border:1px solid var(--line); border-radius:6px;
  padding:4px 9px; font-size:12px; font-family:var(--body); color:var(--ink); width:130px;
}
.tblscroll{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14px; min-width:460px}
th,td{padding:11px 14px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line); line-height:1.65}
th{
  background:var(--slate-soft); color:var(--slate); font-weight:600; font-size:12.5px;
  letter-spacing:.02em; white-space:nowrap;
}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
td:first-child{font-weight:600; color:var(--ink); white-space:nowrap}
tr.hide{display:none}

/* comparison split */
.split{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.split .col{background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:14px 16px}
.split .col.bad{border-color:color-mix(in srgb, var(--accent) 40%, var(--line))}
.split .col .lbl{
  font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink3); margin-bottom:8px;
}
.split .col.bad .lbl{color:var(--accent)}
.split .col.good .lbl{color:var(--good)}
.split .col p{margin:0; font-size:14.2px; line-height:1.7; color:var(--ink2)}
.split .col .q{font-size:14.6px; color:var(--ink); font-weight:500; margin-bottom:7px; line-height:1.6}

/* quiz */
.quiz{
  margin-top:44px; border-top:2px solid var(--ink); padding-top:26px;
  display:flex; flex-direction:column; gap:16px;
}
.quiz-h{display:flex; align-items:baseline; gap:11px; flex-wrap:wrap}
.quiz-h h3{font-family:var(--display); font-weight:900; font-size:20px; margin:0; letter-spacing:-.01em}
.quiz-h .score{
  font-family:var(--mono); font-size:12px; color:var(--ink3); margin-left:auto;
  font-variant-numeric:tabular-nums;
}
.q{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px}
.q .qn{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--accent); margin-bottom:7px;
}
.q .qt{font-size:15px; font-weight:600; line-height:1.65; margin-bottom:13px; color:var(--ink)}
.opts{display:flex; flex-direction:column; gap:8px}
.opt{
  display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%;
  background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:10px 13px;

</script>
<script>
/* ---------------- state ---------------- */
const KEY = 'claude-guide-v1';
let ST = {done:{}, quiz:{}, theme:null, last:null, vpos:{}};
try{ const raw = localStorage.getItem(KEY); if(raw) ST = Object.assign(ST, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){} }

function boot(){
/* chapter video lesson goes first in each chapter */
const LESSONS = [];
PARTS.forEach((p, pi) => {
  p.gnum = (pi + 1) + '장';
  const v = VIDEOS[p.id];
  if(v){
    p.lessons.unshift({
      id: p.id + '-v', video: p.id, short: '영상 강의', title: '영상 강의 · ' + p.title,
      intro: p.gnum + ' 핵심 내용을 약 ' + Math.round(v.duration / 60) + '분 영상으로 먼저 훑어봅니다. 아래 목차를 누르면 해당 장면으로 이동하고, 자막은 기본으로 켜져 있습니다. 레슨을 읽기 전에 보거나 복습용으로 활용하세요.',
      blocks: [['video', p.id]]
    });
  }
  p.lessons.forEach(l => {
    l.part = p;
    l.gno = l.video ? '▶' : String(LESSONS.filter(x => !x.video).length + 1).padStart(2, '0');
    LESSONS.push(l);
  });
});
const TEXT_LESSONS = LESSONS.filter(l => !l.video);
const TOTAL_Q = LESSONS.reduce((n,l)=>n+(l.quiz?l.quiz.length:0),0);

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
function el(tag, cls, html){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(html != null) n.innerHTML = html;
  return n;
}
function strip(s){ return String(s).replace(/<[^>]+>/g,''); }
function fmt(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); }

/* ---------------- theme ---------------- */
if(ST.theme) document.documentElement.setAttribute('data-theme', ST.theme);
$('#themebtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const isDark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  ST.theme = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', ST.theme);
  save();
};

/* ---------------- offline video cache ---------------- */
const IS_ART = (typeof MODE !== 'undefined' && MODE === 'artifact');
const hasCache = !IS_ART && 'caches' in window;
async function isCached(url){
  if(!hasCache) return false;
  try{ const c = await caches.open(VCACHE); return !!(await c.match(url)); }catch(e){ return false; }
}
async function cacheVideo(url, onProgress){
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const total = +res.headers.get('content-length') || 0;
  const reader = res.body.getReader();
  const chunks = []; let got = 0;
  for(;;){
    const {done, value} = await reader.read();
    if(done) break;
    chunks.push(value); got += value.length;
    if(onProgress) onProgress(got, total);
  }
  const blob = new Blob(chunks, {type:'application/octet-stream'});
  const c = await caches.open(VCACHE);
  await c.put(url, new Response(blob, {headers:{'Content-Type':'application/octet-stream','Content-Length':String(blob.size)}}));
}
async function refreshOffline(){
  const ids = Object.keys(VIDEOS);
  let n = 0;
  for(const id of ids) if(await isCached(VIDEOS[id].src)) n++;
  const mb = ids.reduce((s,id)=>s+VIDEOS[id].size,0) / 1e6;
  const btn = $('#offbtn');
  if(IS_ART){ $('#offline').hidden = true; return; }
  if(!hasCache){ $('#offlbl').innerHTML = '<b>오프라인 영상</b><br>이 브라우저는 저장을 지원하지 않습니다'; btn.style.display='none'; return; }
  $('#offlbl').innerHTML = '<b>오프라인 영상 ' + n + ' / ' + ids.length + '편 저장됨</b><br>전체 약 ' + mb.toFixed(0) + 'MB · 레슨 글은 자동 저장';
  btn.textContent = n === ids.length ? '저장 완료' : '전체 저장';
  btn.classList.toggle('ok', n === ids.length);
  btn.disabled = n === ids.length;
}
$('#offbtn').onclick = async () => {
  const btn = $('#offbtn'), bar = $('#offbar');
  btn.disabled = true; bar.style.display = 'block';
  const ids = Object.keys(VIDEOS);
  const total = ids.reduce((s,id)=>s+VIDEOS[id].size,0);
  let base = 0;
  try{
    for(const id of ids){
      const v = VIDEOS[id];
      if(!(await isCached(v.src))){
        btn.textContent = id.replace('ch','') + '장 저장 중…';
        await cacheVideo(v.src, got => { bar.firstChild.style.width = ((base + got) / total * 100).toFixed(1) + '%'; });
      }
      base += v.size;
      bar.firstChild.style.width = (base / total * 100).toFixed(1) + '%';
    }
  }catch(e){ $('#offlbl').innerHTML = '<b>저장 실패</b><br>네트워크 연결을 확인한 뒤 다시 누르세요'; bar.style.display = 'none'; btn.disabled = false; btn.textContent = '다시 시도'; return; }
  bar.style.display = 'none';
  refreshOffline();
  if(current && current.video) renderLesson(current);
};

/* ---------------- video block ---------------- */
function renderVideo(id){
  const v = VIDEOS[id];
  const box = el('div');
  const wrap = el('div','vwrap');
  const vid = document.createElement('video');
  vid.controls = true; vid.playsInline = true; vid.preload = 'metadata';
  vid.setAttribute('playsinline','');
  const vstat = el('div','vstat');
  (async () => {
    try{
      vstat.textContent = '영상 준비 중…';
      decryptUrl(v.poster, 'image/jpeg').then(u => { vid.poster = u; }).catch(()=>{});
      vid.src = await decryptUrl(v.src, 'video/mp4');
      vstat.textContent = '';
    }catch(e){ vstat.textContent = '영상을 불러오지 못했습니다. 인터넷에 연결한 뒤 다시 열거나, 미리 오프라인 저장을 해두세요.'; }
  })();
  let ov = null;
  if(v.cues){
    ov = el('div','vsub');
    wrap.appendChild(vid); wrap.appendChild(ov);
    let last = -1;
    const sync = () => {
      const t = vid.currentTime;
      let k = -1;
      for(let i = 0; i < v.cues.length; i++){ if(t >= v.cues[i][0] && t <= v.cues[i][1] + 0.15){ k = i; break; } }
      if(k !== last){ last = k; ov.textContent = k >= 0 ? v.cues[k][2] : ''; ov.classList.toggle('on', k >= 0); }
    };
    vid.addEventListener('timeupdate', sync); vid.addEventListener('seeked', sync);
  } else {
    const tr = document.createElement('track');
    tr.kind = 'subtitles'; tr.srclang = 'ko'; tr.label = '한국어'; tr.src = v.vtt; tr.default = true;
    vid.appendChild(tr);
    wrap.appendChild(vid);
  }
  box.appendChild(wrap);

  const bar = el('div','vbar');
  const sub = el('button','vbtn','자막 끄기'); sub.type = 'button';
  sub.onclick = () => {
    if(ov){ ov.hidden = !ov.hidden; sub.textContent = ov.hidden ? '자막 켜기' : '자막 끄기'; return; }
    const t = vid.textTracks[0]; if(!t) return;
    t.mode = t.mode === 'showing' ? 'hidden' : 'showing';
    sub.textContent = t.mode === 'showing' ? '자막 끄기' : '자막 켜기';
  };
  const speed = el('button','vbtn','속도 1.0×'); speed.type = 'button';
  const rates = [1, 1.25, 1.5, 0.9];
  speed.onclick = () => {
    const i = (rates.indexOf(vid.playbackRate) + 1) % rates.length;
    vid.playbackRate = rates[i]; speed.textContent = '속도 ' + rates[i].toFixed(rates[i] % 1 ? 2 : 1).replace(/0$/,'') + '×';
  };
  const dl = el('button','vbtn pri','이 영상 오프라인 저장'); dl.type = 'button';
  const stat = el('span','vstat', '약 ' + Math.round(v.duration/60) + '분 · ' + (v.size/1e6).toFixed(1) + 'MB');
  isCached(v.src).then(ok => { if(ok){ dl.textContent = '✓ 오프라인 저장됨'; dl.className = 'vbtn ok'; dl.disabled = true; } });
  if(!hasCache) dl.style.display = 'none';
  dl.onclick = async () => {
    dl.disabled = true;
    try{
      await cacheVideo(v.src, (got,total) => { dl.textContent = '저장 중… ' + (total ? Math.round(got/total*100) : Math.round(got/1e6)) + (total ? '%' : 'MB'); });
      dl.textContent = '✓ 오프라인 저장됨'; dl.className = 'vbtn ok';
      refreshOffline();
    }catch(e){ dl.disabled = false; dl.textContent = '저장 실패 · 다시 시도'; }
  };
  bar.appendChild(sub); bar.appendChild(speed); bar.appendChild(dl); bar.appendChild(stat);
  box.appendChild(bar);
  vstat.style.marginLeft = '0'; vstat.style.marginTop = '8px'; box.appendChild(vstat);

  const marks = el('div','marks');
  marks.style.marginTop = '18px';
  marks.appendChild(el('div','mh','영상 목차 · 누르면 해당 장면으로 이동'));
  const mbtns = v.marks.map((m,i) => {
    const b = el('button'); b.type = 'button';
    b.appendChild(el('span','tm', fmt(m.t)));
    b.appendChild(el('span',null, m.title));
    b.onclick = () => { vid.currentTime = m.t + 0.05; vid.play().catch(()=>{}); window.scrollTo({top:0, behavior:'smooth'}); };
    marks.appendChild(b);
    return b;
  });
  box.appendChild(marks);

  const resume = ST.vpos[id];
  vid.addEventListener('loadedmetadata', () => { if(resume && resume > 5 && resume < v.duration - 10) vid.currentTime = resume; }, {once:true});
  let lastSave = 0;
  vid.addEventListener('timeupdate', () => {
    const t = vid.currentTime;
    let k = 0; v.marks.forEach((m,i) => { if(t >= m.t) k = i; });
    mbtns.forEach((b,i) => b.classList.toggle('on', i === k));
    if(Math.abs(t - lastSave) > 5){ lastSave = t; ST.vpos[id] = t; save(); }
  });
  vid.addEventListener('ended', () => {
    ST.vpos[id] = 0;
    const lid = id + '-v';
    if(!ST.done[lid]){ ST.done[lid] = true; buildToc(); buildTabs(); updateProgress(); const d = $('.donebtn'); if(d){ d.className = 'donebtn is-done'; d.textContent = '✓ 이 영상을 시청했습니다'; } }
    save();
  });
  return box;
}

/* ---------------- block renderer ---------------- */
function renderBlock(b, id){
  const t = b[0];
  let node;
  if(t === 'h'){ node = el('h3','sec',b[1]); }
  else if(t === 'h4'){ node = el('h4','sub',b[1]); }
  else if(t === 'p'){ node = el('p','tx',b[1]); }
  else if(t === 'ul' || t === 'ol'){
    node = el(t === 'ul' ? 'ul' : 'ol','li');
    b[1].forEach(x => node.appendChild(el('li',null,x)));
  }
  else if(t === 'ui'){
    node = el('div','uilist');
    b[1].forEach(r => {
      const row = el('div','row');
      row.appendChild(el('div','n',r[0]));
      const c = el('div');
      c.appendChild(el('div','nm',r[1]));
      c.appendChild(el('div','ds',r[2]));
      row.appendChild(c);
      node.appendChild(row);
    });
  }
  else if(t === 'prompt'){
    node = el('div','prompt');
    const h = el('div','ph');
    h.appendChild(el('span','who', b[2] ? strip(b[2]) : '프롬프트'));
    const btn = el('button','copy','복사');
    btn.type = 'button';
    btn.onclick = () => {
      const done = () => { btn.textContent = '복사됨'; btn.classList.add('ok'); setTimeout(()=>{ btn.textContent='복사'; btn.classList.remove('ok'); },1600); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(b[1]).then(done).catch(()=>{ fallbackCopy(b[1]); done(); });
      } else { fallbackCopy(b[1]); done(); }
    };
    h.appendChild(btn);
    node.appendChild(h);
    const pre = el('pre'); pre.textContent = b[1];
    node.appendChild(pre);
  }
  else if(t === 'out'){
    node = el('div','output');
    const h = el('div','oh');
    h.appendChild(el('span','star','✳'));
    h.appendChild(el('span',null, b[2] ? strip(b[2]) : '클로드 답변 예시'));
    node.appendChild(h);
    const body = el('div','ob'); body.textContent = b[1];
    node.appendChild(body);
    if(b[3]){
      const tr = el('div','trim');
      tr.appendChild(el('b',null,'예시'));
      tr.appendChild(el('span',null,'실제 답변은 이보다 길고, 실행할 때마다 표현이 조금씩 달라집니다.'));
      node.appendChild(tr);
    }
  }
  else if(t === 'tip'){
    node = el('div','tip');
    node.appendChild(el('span','lb','TIP'));
    node.appendChild(el('p',null,b[1]));
  }
  else if(t === 'sum'){
    node = el('div','summary');
    node.appendChild(el('div','st','핵심 정리'));
    const ul = el('ul');
    b[1].forEach(x => ul.appendChild(el('li',null,x)));
    node.appendChild(ul);
  }
  else if(t === 'tbl'){
    node = el('div','tblwrap');
    const cap = el('div','tblcap');
    cap.appendChild(el('span',null,b[1]));
    const wrap = el('div','tblscroll');
    const table = el('table');
    const thead = el('thead'); const tr = el('tr');
    b[2].forEach(h => tr.appendChild(el('th',null,h)));
    thead.appendChild(tr); table.appendChild(thead);
    const tb = el('tbody');
    b[3].forEach(r => {
      const row = el('tr');
      r.forEach(c => row.appendChild(el('td',null,c)));
      tb.appendChild(row);
    });
    table.appendChild(tb);
    if(b[4]){
      const f = document.createElement('input');
      f.type = 'search'; f.placeholder = '표 안에서 거르기';
      f.oninput = () => {
        const q = f.value.trim().toLowerCase();
        [...tb.rows].forEach(r => r.classList.toggle('hide', q !== '' && !r.textContent.toLowerCase().includes(q)));
      };
      cap.appendChild(f);
    }
    node.appendChild(cap);
    wrap.appendChild(table);
    node.appendChild(wrap);
  }
  else if(t === 'split'){
    node = el('div','split');
    b[1].forEach(c => {
      const col = el('div','col ' + (c.kind || ''));
      col.appendChild(el('div','lbl',c.lbl));
      if(c.q) col.appendChild(el('div','q','“' + c.q + '”'));
      col.appendChild(el('p',null,c.p));
      node.appendChild(col);
    });
  }
  else if(t === 'video'){ node = renderVideo(b[1]); }
  else { node = el('p','tx', String(b[1] || '')); }
  node.id = id;
  return node;
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
}

/* ---------------- quiz ---------------- */
function renderQuiz(lesson){
  const wrap = el('div','quiz');
  const head = el('div','quiz-h');
  head.appendChild(el('h3',null,'확인 문제'));
  const score = el('div','score');
  head.appendChild(score);
  wrap.appendChild(head);
  function refresh(){
    let ok = 0, ans = 0;
    lesson.quiz.forEach((q,i) => { const v = ST.quiz[lesson.id + ':' + i]; if(v){ ans++; if(v === 'o') ok++; } });
    score.textContent = ok + ' / ' + lesson.quiz.length + ' 정답 · ' + ans + '문항 응답';
    updateProgress();
  }
  lesson.quiz.forEach((q,i) => {
    const key = lesson.id + ':' + i;
    const card = el('div','q');
    card.appendChild(el('div','qn','Q' + (i+1)));
    card.appendChild(el('div','qt', q.q));
    const expl = el('div','expl', q.e);
    if(q.t === 'choice'){
      const opts = el('div','opts');
      const btns = [];
      q.o.forEach((o,j) => {
        const b = el('button','opt'); b.type = 'button';
        b.appendChild(el('span','mk', String.fromCharCode(65+j)));
        b.appendChild(el('span',null,o));
        b.onclick = () => {
          btns.forEach(x => x.disabled = true);
          btns[q.a].classList.add('correct');
          if(j !== q.a) b.classList.add('wrong');
          ST.quiz[key] = (j === q.a) ? 'o' : 'x';
          save(); expl.classList.add('show'); refresh();
        };
        btns.push(b); opts.appendChild(b);
      });
      card.appendChild(opts);
      if(ST.quiz[key]){ btns.forEach(x => x.disabled = true); btns[q.a].classList.add('correct'); expl.classList.add('show'); }
    } else {
      const row = el('div','fillrow');
      const inp = document.createElement('input');
      inp.type = 'text'; inp.placeholder = '답을 입력하세요';
      const btn = el('button',null,'확인'); btn.type = 'button';
      const check = () => {
        const v = inp.value.trim().toLowerCase().replace(/\s+/g,'');
        const good = q.a.some(a => a.toLowerCase().replace(/\s+/g,'') === v);
        inp.classList.remove('ok','no'); inp.classList.add(good ? 'ok' : 'no');
        ST.quiz[key] = good ? 'o' : 'x';
        save(); expl.classList.add('show'); refresh();
      };
      btn.onclick = check;
      inp.onkeydown = e => { if(e.key === 'Enter') check(); };
      row.appendChild(inp); row.appendChild(btn);
      card.appendChild(row);
      if(ST.quiz[key]){ inp.classList.add(ST.quiz[key] === 'o' ? 'ok' : 'no'); expl.classList.add('show'); }
    }
    card.appendChild(expl);
    wrap.appendChild(card);
  });
  refresh();
  return wrap;
}

/* ---------------- tab strip ---------------- */
function buildTabs(){
  const grp = $('#grp'), tabs = $('#tabs');
  grp.innerHTML = ''; tabs.innerHTML = '';
  PARTS.forEach((p, pi) => {
    if(pi > 0) grp.appendChild(el('span','sep','·'));
    const b = el('button', p === current.part ? 'on' : '', p.gnum + ' ' + p.short);
    b.type = 'button';
    b.onclick = () => { location.hash = '#' + p.lessons[0].id; };
    grp.appendChild(b);
  });
  let active = null;
  PARTS.forEach((p, pi) => {
    const box = el('div','tgrp' + (p === current.part ? ' cur' : ''));
    const done = p.lessons.filter(l => ST.done[l.id]).length;
    const lab = el('div','tlab');
    lab.appendChild(el('span',null, p.gnum + ' ' + p.short));
    lab.appendChild(el('span','cnt', done + '/' + p.lessons.length));
    box.appendChild(lab);
    p.lessons.forEach(l => {
      const a = el('a','tab' + (l === current ? ' on' : '') + (ST.done[l.id] ? ' done' : '') + (l.video ? ' vid' : ''));
      a.href = '#' + l.id; a.title = l.title;
      a.appendChild(el('div','n', l.video ? '영상' : l.gno));
      a.appendChild(el('div','t', l.short));
      if(l === current) active = a;
      box.appendChild(a);
    });
    tabs.appendChild(box);
  });
  if(active){
    const grp = active.parentElement;
    const absLeft = active.offsetLeft + grp.offsetLeft;
    let left = absLeft - (tabs.clientWidth - active.offsetWidth) / 2;
    // keep the chapter label (group start) visible when the group fits or the active card is near its start
    if(grp.offsetWidth <= tabs.clientWidth - 16 || active.offsetLeft < tabs.clientWidth * 0.45) left = grp.offsetLeft - 12;
    tabs.scrollTo({left: Math.max(0, left), behavior: 'auto'});
  }
}

const C = 2 * Math.PI * 19, C2 = 2 * Math.PI * 8;

/* ---------------- search ---------------- */
const INDEX = [];
const KIND = {h:'소제목',h4:'소제목',p:'본문',ul:'목록',ol:'단계',ui:'화면 요소',prompt:'프롬프트',out:'답변 예시',tip:'TIP',sum:'정리',tbl:'표',split:'비교'};
LESSONS.forEach(l => {
  INDEX.push({l, i:-1, txt: l.title + ' ' + l.intro, kind: l.video ? '영상' : '레슨 소개'});
  l.blocks.forEach((b,i) => {
    const t = b[0];
    let txt = '';
    if(t === 'video') txt = VIDEOS[b[1]].marks.map(m => m.title).join(' · ');
    else if(t === 'ul' || t === 'ol' || t === 'sum') txt = b[1].join(' · ');
    else if(t === 'ui') txt = b[1].map(r => r[1] + ' ' + r[2]).join(' · ');
    else if(t === 'tbl') txt = b[1] + ' · ' + b[2].join(' ') + ' · ' + b[3].map(r => r.join(' ')).join(' · ');
    else if(t === 'split') txt = b[1].map(c => c.lbl + ' ' + (c.q||'') + ' ' + c.p).join(' · ');
    else txt = String(b[1] || '');
    INDEX.push({l, i, txt: strip(txt), kind: t === 'video' ? '영상 목차' : (KIND[t] || '본문')});
  });
  (l.quiz||[]).forEach(q => INDEX.push({l, i:-1, txt: strip(q.q + ' ' + q.e), kind:'확인 문제'}));
});
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function snippet(txt, q){
  const at = txt.toLowerCase().indexOf(q.toLowerCase());
  const s = Math.max(0, at - 40);
  const cut = (s > 0 ? '…' : '') + txt.slice(s, at + q.length + 90) + (txt.length > at + q.length + 90 ? '…' : '');
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'ig');
  return esc(cut).replace(re, m => '<mark>' + m + '</mark>');
}
const ovl = $('#ovl'), sinput = $('#sinput'), results = $('#results');

function closeSearch(){ ovl.classList.remove('open'); }

ovl.onclick = e => { if(e.target === ovl) closeSearch(); };
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeSearch();
  if(e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){ e.preventDefault(); openSearch(); }
});
sinput.oninput = () => {
  const q = sinput.value.trim();
  results.innerHTML = '';

  hits.forEach(h => {

  });
};

<script>
/* ---------------- unlock: password → key → decrypt content ---------------- */
const SALT = Uint8Array.from(atob('TnKG+a/TpjvcgxX6bYEPyw=='), c => c.charCodeAt(0));
const ITER = 1000000;
let CKEY = null;
const enc = new TextEncoder(), dec = new TextDecoder();

async function deriveKey(pw){
  const km = await crypto.subtle.importKey('raw', enc.encode(pw.normalize('NFKC').trim()), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:SALT, iterations:ITER, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function decryptBuf(key, buf){
  const u = new Uint8Array(buf);
  if(u.length < 17 || String.fromCharCode(u[0],u[1],u[2],u[3]) !== 'CGE1') throw new Error('bad-format');
  return crypto.subtle.decrypt({name:'AES-GCM', iv:u.slice(4,16)}, key, u.slice(16));
}
async function fetchEnc(url, fresh){
  const r = await fetch(url, fresh ? {cache:'reload'} : {});
  if(!r.ok) throw new Error('http-' + r.status);
  return r.arrayBuffer();
}
async function decryptUrl(url, type){
  const pt = await decryptBuf(CKEY, await fetchEnc(url));
  return URL.createObjectURL(new Blob([pt], {type}));
}

/* key store (IndexedDB) so the password is asked once per device */
function kdb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('cg-keys', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('k');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function kop(mode, fn){
  return kdb().then(db => new Promise((res, rej) => {
    const tx = db.transaction('k', mode); const req = fn(tx.objectStore('k'));
    tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error);
  })).catch(() => null);
}
const getKey = () => kop('readonly', s => s.get('key'));
const putKey = k => kop('readwrite', s => s.put(k, 'key'));
const delKey = () => kop('readwrite', s => s.delete('key'));

const isNet = e => /http|fetch|Load failed|network|abort/i.test(String(e && (e.name + ' ' + e.message)));
async function unlockWith(key, fresh){
  let data;
  try{ data = JSON.parse(dec.decode(await decryptBuf(key, await fetchEnc('content.enc', fresh)))); }
  catch(e){
    if(fresh || isNet(e) || !navigator.onLine) throw e;
    data = JSON.parse(dec.decode(await decryptBuf(key, await fetchEnc('content.enc', true))));   // stale copy? retry from network
  }
  CKEY = key; PARTS = data.parts; VIDEOS = data.videos;
  document.getElementById('lock').hidden = true;
  document.querySelector('.shell').hidden = false;
  boot();
}
function showLock(msg){
  const l = document.getElementById('lock'); l.hidden = false;
  document.getElementById('lockmsg').textContent = msg || '';
  setTimeout(() => document.getElementById('pw').focus(), 50);
}
async function start(){
  try{ const t = localStorage.getItem('claude-guide-v1'); const th = t && JSON.parse(t).theme; if(th) document.documentElement.setAttribute('data-theme', th); }catch(e){}
  if(!window.crypto || !crypto.subtle){ showLock('이 브라우저는 암호 해제를 지원하지 않습니다. Safari 또는 Chrome에서 여세요.'); return; }
  const k = await getKey();
  if(k){
    try{ await unlockWith(k); return; }
    catch(e){ if(!isNet(e)) await delKey(); }
  }
  showLock();
}
document.getElementById('lockform').onsubmit = async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  if(!pw) return;
  const btn = document.getElementById('lockbtn2'); btn.disabled = true;
  document.getElementById('lockmsg').textContent = '확인 중…';
  try{
    const key = await deriveKey(pw);
    await unlockWith(key);
    await putKey(key);
  }catch(err){
    document.getElementById('lockmsg').textContent = isNet(err) ? '내용을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도하세요.' : '비밀번호가 맞지 않습니다.';
  }
  btn.disabled = false;
};
document.getElementById('pwshow').onclick = () => { const p = document.getElementById('pw'); p.type = p.type === 'password' ? 'text' : 'password'; };
start();

</script>
</body></html>
