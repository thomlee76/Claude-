<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日本語 復習ノート</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日本語">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F7F8">
<style>
/* ===== 日本語 復習ノート — 출석형 레이아웃 ============================= */
:root{--fill:var(--ac);--on:#fff;
  --bg:#F7F7F8;--sf:#FFFFFF;--sf2:#F1F1F3;--ln:#E6E6EA;--tx:#111113;--mu:#8A8A90;
  --ac:#111113;--ac2:#ECECEF;--acd:#000;
  --ok:#2EB872;--oks:#E6F7EE;--bad:#E5484D;--bads:#FCE9EA;--wn:#E8601C;--wns:#FFF2C9;
  --blue:#3B82F6;--lime:#B5F03F;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Noto Sans JP","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0B0C;--sf:#161618;--sf2:#202023;--ln:#2A2A2E;--tx:#F2F2F2;--mu:#8E8E93;
  --ac:#F2F2F2;--ac2:#26262A;--acd:#fff;--on:#111113;
  --ok:#4FD28F;--oks:#17302A;--bad:#F08A7E;--bads:#3B1F1C;--wn:#F2A35A;--wns:#3A2F14;}}
:root[data-theme="dark"]{
  --bg:#0B0B0C;--sf:#161618;--sf2:#202023;--ln:#2A2A2E;--tx:#F2F2F2;--mu:#8E8E93;
  --ac:#F2F2F2;--ac2:#26262A;--acd:#fff;--on:#111113;
  --ok:#4FD28F;--oks:#17302A;--bad:#F08A7E;--bads:#3B1F1C;--wn:#F2A35A;--wns:#3A2F14;}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);min-height:100vh}
img{max-width:100%}button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.jp,ruby{font-family:var(--jp)}ruby{ruby-align:center}
rt{font-size:.5em;color:var(--mu);font-weight:400;letter-spacing:-.02em}
body.nofuri rt{visibility:hidden}
.muted{color:var(--mu);font-size:13px}.ok{color:var(--ok);font-weight:600}.no{color:var(--bad);text-decoration:line-through}
.page{max-width:560px;margin:0 auto;padding:0 20px 110px}
body.sub .page{padding-bottom:40px}
.hid{display:none!important}

/* ---------- 스플래시 ---------- */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--tx);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;letter-spacing:-.03em;transition:opacity .4s;gap:8px}
#splash i{font-style:italic;font-weight:900;font-size:36px;letter-spacing:-.06em}
#splash.off{opacity:0;pointer-events:none}

/* ---------- 홈 ---------- */
.ht{display:flex;align-items:center;justify-content:space-between;padding:16px 0 4px}
.ht .ttl{font-size:30px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;line-height:1.2}
.ht .ttl svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.4;fill:none;margin-top:3px}
.seg{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700}
.seg button{color:var(--mu);position:relative;line-height:1.2}.seg button.on{color:var(--tx)}
.seg .sep{width:1px;height:22px;background:var(--ln)}
.seg .dot::after{content:"";position:absolute;top:-2px;right:-8px;width:7px;height:7px;border-radius:50%;background:#FF3B30}
.weekw{margin:0 -20px;padding:0 20px;border-bottom:1px solid var(--ln)}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;padding:14px 0 2px}
.week .dn{font-size:14px;color:var(--mu)}
.week .dd{height:52px;margin-top:18px;display:flex;align-items:center;justify-content:center;font-size:19px;position:relative;color:var(--tx)}
.week .dd.fut{color:var(--mu)}
.week .dd svg{position:absolute;width:44px;height:44px;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg)}
.week .dd .t{width:36px;height:36px;border-radius:50%;background:var(--tx);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;position:relative;z-index:1}
.handle{width:44px;height:4px;border-radius:2px;background:var(--ln);margin:8px auto 10px}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 10px}
.dayh b{font-size:26px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}.dayh span{font-size:13px;color:var(--mu);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin-left:14px}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:4px 36px 20px;scrollbar-width:none;scroll-padding:0 36px}
.car::-webkit-scrollbar{display:none}
.hc{flex:none;width:calc(100% - 72px);scroll-snap-align:center;background:var(--sf);border-radius:26px;padding:16px;box-shadow:0 2px 16px rgba(0,0,0,.06)}
.hc .art{height:170px;border-radius:16px;overflow:hidden;background:var(--sf2);position:relative}
.strip{display:flex;gap:5px;height:100%;padding:6px}
.strip .mc{flex:1;border:1px solid var(--ln);border-radius:12px;background:var(--sf);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.strip .mc:first-child{flex:2.4}
.strip .mc .im{flex:1;display:flex;align-items:center;justify-content:center;font-size:30px;background:linear-gradient(160deg,#FDE7DF,#E2ECF8)}
.strip .mc:nth-child(2n) .im{background:linear-gradient(160deg,#E4F2EA,#F4E6F7)}.strip .mc:nth-child(3n) .im{background:linear-gradient(160deg,#FFF3C9,#E2ECF8)}
.strip .mc .tx{padding:5px 4px 6px;text-align:center;font-weight:700;font-size:13px;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .mc .tx small{display:block;font-size:10px;color:var(--mu);font-weight:500}
.strip .mc:not(:first-child) .tx{visibility:hidden}
.art.dark{background:#17181B;color:#fff;display:flex;align-items:flex-end;padding:16px}
.art.dark img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:.28;filter:grayscale(1) contrast(1.1)}
.art.dark .g{position:relative;font-size:56px;font-weight:900;font-family:var(--jp);line-height:1;letter-spacing:-.04em}
.art.dark .s{position:relative;font-size:12px;letter-spacing:.2em;font-weight:700;opacity:.8;margin-left:10px;margin-bottom:6px}
.art .sg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;height:100%;padding:6px}
.art .sg img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:9px;border:1px solid var(--ln);background:#fff}
.art .big{display:flex;align-items:center;justify-content:center;height:100%;font-family:var(--jp);font-size:64px;font-weight:800;letter-spacing:.08em;background:linear-gradient(160deg,var(--sf2),var(--sf))}
.hc h2{font-size:22px;font-weight:800;margin:18px 0 12px;letter-spacing:-.02em}
.pb{height:8px;background:var(--sf2);border-radius:4px;overflow:hidden}.pb i{display:block;height:100%;background:var(--tx);border-radius:4px;transition:width .3s}
.hc .pm{display:flex;justify-content:space-between;font-size:14px;color:var(--mu);margin:10px 0 14px}
.hc .div{border-top:1px solid var(--ln)}
.hc .info{text-align:center;font-size:16px;padding:18px 0 14px}
.bigbtn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:14px;background:var(--fill);color:var(--on);font-size:18px;font-weight:700}
.bigbtn.g{background:#B9B9BD;color:#fff}.bigbtn.w{background:var(--sf);color:var(--tx);box-shadow:inset 0 0 0 1px var(--ln)}

/* ---------- 하단 탭 ---------- */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
body.sub nav{display:none}
.tabs{display:flex;align-items:center;max-width:560px;margin:0 auto;padding:8px 16px 6px}
.tab{flex:1;text-align:center;font-size:11px;color:var(--mu);font-weight:600;padding:2px 0}
.tab svg{width:26px;height:26px;display:block;margin:0 auto 3px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--tx)}.tab.on svg{fill:currentColor}.tab.on svg.nf{fill:none;stroke-width:2.6}
.ava{flex:none;width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;margin-left:10px;font-family:var(--jp)}
.ava.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--blue)}

/* ---------- 상단 바 (서브 페이지) ---------- */
.tb{position:sticky;top:0;z-index:12;background:var(--bg);display:flex;align-items:center;justify-content:space-between;height:56px;margin:0 -20px;padding:0 10px;border-bottom:1px solid var(--ln)}
.tb .ic{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:24px;border-radius:50%}
.tb .ic svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tb .mid{display:flex;gap:10px;align-items:center;font-size:17px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--sf);border-radius:22px;padding:7px 16px;font-size:17px;font-weight:700;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.pill .ckr{width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.pill .xr{width:22px;height:22px;border-radius:50%;background:var(--sf2);color:var(--mu);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.pill .g{color:var(--ok)}

/* ---------- 플래시카드 ---------- */
.fcard{background:var(--sf);border-radius:28px;overflow:hidden;box-shadow:0 6px 28px rgba(0,0,0,.08);margin-top:18px;display:flex;flex-direction:column;min-height:calc(100vh - 230px)}
.fcard .hero{height:min(46vw,250px);background:linear-gradient(135deg,#FDE7DF 0%,#E2ECF8 100%);display:flex;align-items:center;justify-content:center;font-size:96px;position:relative}
.fcard .hero.h2{background:linear-gradient(135deg,#E4F2EA,#F4E6F7)}.fcard .hero.h3{background:linear-gradient(135deg,#FFF3C9,#E2ECF8)}.fcard .hero.h4{background:linear-gradient(135deg,#E8E6FA,#FDE7DF)}
.fcard .hero .cat{position:absolute;left:16px;top:14px;font-size:12px;font-weight:700;background:rgba(255,255,255,.8);color:#333;border-radius:8px;padding:4px 9px}
.fcard .hero .bm{position:absolute;right:16px;bottom:16px;width:48px;height:48px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.fcard .hero .bm svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linejoin:round}
.fcard .body{padding:20px 20px 18px;flex:1;display:flex;flex-direction:column}
.fcard .w{font-size:40px;font-weight:800;line-height:1.2;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.fcard .w .spk{flex:none;width:46px;height:46px;border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--mu);margin-top:4px}
.fcard .rd{font-size:17px;color:var(--mu);margin-top:4px;display:none}body.nofuri .fcard .rd{display:block}.fcard .w rt{font-size:.4em;color:var(--mu)}
.fcard .pos{display:flex;align-items:center;gap:9px;font-size:22px;margin-top:12px;font-weight:500}
.fcard .pos i{flex:none;background:var(--sf2);color:var(--mu);border-radius:50%;width:26px;height:26px;font-size:12px;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center}
.fcard .sep{border-top:1px solid var(--ln);margin:18px 0 14px}
.fcard .exj{font-size:19px;line-height:2.1;font-weight:500}
.fcard .exk{font-size:15px;margin-top:8px;line-height:1.6}
.fcard .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:22px}
.fcard .foot .lv{color:var(--mu);font-size:16px;font-weight:600}
.fcard .foot .tip{background:var(--sf2);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:700}
.fcard.peek .pos,.fcard.peek .exj,.fcard.peek .exk{filter:blur(7px);user-select:none;pointer-events:none}
.fcard.peek .body::after{content:"탭하면 뜻이 보입니다";display:block;text-align:center;font-size:12px;color:var(--mu);margin-top:10px}
.fbtns{display:flex;gap:12px;position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;z-index:11;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.fbtns button{flex:1;height:62px;border-radius:16px;font-size:18px;font-weight:700;text-align:center}
.fbtns .fno{background:var(--sf);color:var(--tx);box-shadow:0 1px 6px rgba(0,0,0,.08)}.fhost{padding-bottom:110px}
.fbtns .yes{background:var(--tx);color:var(--bg)}
.fdone{background:var(--sf);border-radius:28px;padding:40px 24px;margin-top:20px;text-align:center}
.fdone .em{font-size:60px}.fdone b{display:block;font-size:26px;font-weight:800;margin-top:10px}.fdone p{color:var(--mu);margin-top:6px}

/* ---------- 라이브러리 ---------- */
.lt{display:flex;gap:18px;align-items:baseline;padding:18px 0 12px}
.lt button{font-size:30px;font-weight:800;color:var(--mu);letter-spacing:-.03em}.lt button.on{color:var(--tx)}
.search{display:flex;align-items:center;gap:10px;background:var(--sf2);border-radius:14px;padding:14px 16px;font-size:17px;color:var(--mu)}
.search svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.2;fill:none;flex:none}
.search input{flex:1;border:none;background:none;font:inherit;color:var(--tx);outline:none;min-width:0}
.search input::placeholder{color:var(--mu)}
.sres{background:var(--sf);border-radius:18px;margin-top:10px;overflow:hidden}
.sres .ri{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln);font-size:16px}
.sres .ri:last-child{border-bottom:none}.sres .ri span{color:var(--mu);font-size:13px;white-space:nowrap}.sres .ri b{font-weight:600;line-height:1.9}.sres .ri em{font-style:normal;color:var(--mu);font-size:13px;margin-left:6px}
.banner{display:flex;align-items:center;gap:14px;background:var(--sf2);border-radius:18px;padding:16px;margin-top:14px;width:100%}
.banner .ic{flex:none;width:50px;height:50px;border-radius:50%;background:var(--tx);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px;font-family:var(--jp);font-weight:700}
.banner b{font-size:18px;display:block;font-weight:700}.banner span{font-size:14px;color:var(--mu)}
.banner .ch{margin-left:auto;font-size:24px;color:var(--tx)}
.help{font-size:14px;color:var(--mu);margin:20px 0 12px;display:flex;align-items:center;gap:6px}
.help i{display:inline-flex;width:16px;height:16px;border-radius:50%;background:var(--mu);color:var(--bg);font-size:10px;font-style:normal;font-weight:800;align-items:center;justify-content:center}
.lc{display:block;width:100%;background:var(--sf);border-radius:24px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 10px rgba(0,0,0,.05);position:relative}
.lc .top{padding:22px 20px 0;min-height:132px;position:relative}
.lc .lv{font-size:36px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:-.03em;line-height:1.1}
.lc .lv .badge{background:var(--tx);color:var(--bg);font-size:14px;border-radius:14px;padding:4px 11px;font-weight:700;letter-spacing:0}
.lc .sub{font-size:15px;color:var(--mu);margin-top:6px}
.lc .fan{position:absolute;right:16px;top:8px;width:150px;height:118px;pointer-events:none}
.lc .fan img{position:absolute;width:66px;height:84px;object-fit:cover;object-position:top;border-radius:9px;box-shadow:0 3px 10px rgba(0,0,0,.18);background:#fff;border:1px solid rgba(0,0,0,.06)}
.lc .fan img:nth-child(1){left:6px;top:20px;transform:rotate(-13deg)}.lc .fan img:nth-child(2){left:44px;top:6px;z-index:2}.lc .fan img:nth-child(3){left:82px;top:16px;transform:rotate(13deg)}
.lc .lock{position:absolute;right:14px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--tx);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px;z-index:3}
.lc .pr{display:flex;align-items:center;gap:14px;padding:18px 20px 20px}
.lc .pr .pb{flex:1;height:14px;border-radius:8px;position:relative;overflow:visible}
.lc .pr .pb i{position:relative;min-width:14px}
.lc .pr .pb i::after{content:"";position:absolute;right:-2px;top:-5px;width:24px;height:24px;border-radius:50%;background:var(--sf);box-shadow:0 1px 6px rgba(0,0,0,.18)}
.lc .pr .pb i.z::after{background:#C8C8CD;box-shadow:none;width:14px;height:14px;top:0;right:0}
.lc .pr b{font-size:32px;font-weight:800;min-width:92px;text-align:right;letter-spacing:-.02em}
.lc .ft{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--wns);color:var(--wn);font-weight:700;font-size:17px}
.lc .ft .fire{width:38px;height:38px;border-radius:50%;background:var(--sf);display:flex;align-items:center;justify-content:center;font-size:18px}
.lc .ft.done{background:var(--oks);color:var(--ok)}.lc .ft.idle{background:var(--sf2);color:var(--mu)}
.lc .ft.idle span{font-size:14px;font-weight:500}
.rows{background:var(--sf);border-radius:22px;overflow:hidden;margin-top:14px}
.rows .r{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--ln);width:100%;font-size:17px;font-weight:600}
.rows .r:last-child{border-bottom:none}
.rows .r .g{flex:none;width:40px;height:40px;border-radius:12px;background:var(--sf2);display:flex;align-items:center;justify-content:center;font-family:var(--jp);font-weight:700;font-size:18px}
.rows .r span{margin-left:auto;color:var(--mu);font-weight:500;font-size:14px}.rows .r .ch{margin-left:8px;color:var(--mu)}
.two{display:flex;gap:12px;margin-top:14px}.two .bigbtn{flex:1}
.lhd{padding:20px 0 6px}.lhd .k{font-size:13px;color:var(--mu);font-weight:700;letter-spacing:.06em}.lhd b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.lhd p{color:var(--mu);margin-top:4px;font-size:14px}

/* ---------- 섹션 콘텐츠 (문법·단어·한자·회화) ---------- */
.card{background:var(--sf);border-radius:20px;padding:16px;margin-top:14px}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--ln)}
.ch b{font-size:16px;font-weight:700}.ch span{font-size:13px;color:var(--mu)}
.lk{font-size:13px;color:var(--tx);font-weight:600;border:1px solid var(--ln);border-radius:8px;padding:4px 10px}
h3{font-size:12px;font-weight:700;color:var(--mu);letter-spacing:.08em;margin:14px 0 6px}
.row{display:flex;gap:10px;margin-top:12px}.row .btn{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;color:var(--tx)}
.btn.p{background:var(--fill);border-color:var(--fill);color:var(--on)}.btn.wide{width:100%;margin-top:12px}
.gram p{font-size:15px;line-height:1.75;margin-bottom:8px}
