<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script>/* запуск: открыть последний курс (переключатель «Базовые ⇄ Фразовые») */
try{if(localStorage.getItem("courses:last")==="phrasal"&&!/[?&]icon=/.test(location.search))location.replace("phrasal-verbs/")}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Базовые глаголы 100</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Verb 100">
<meta name="theme-color" content="#FBF8F6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<script>/* Ярлык: ?icon=books (варианты в icons/alt/) — iOS берёт картинку в момент «На экран Домой» */
try{var m=location.search.match(/[?&]icon=([a-z]+)/),ic=m?m[1]:localStorage.getItem("verb100.icon");
if(m)localStorage.setItem("verb100.icon",ic);
if(/^(book|books|plus|chat|mono|split)$/.test(ic))document.querySelectorAll('link[rel="apple-touch-icon"]').forEach(function(l){l.href="icons/alt/"+ic+"-180.png"});}catch(e){}</script>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="bar"><div class="bar-in" id="bar"></div><nav class="steps" id="steps" hidden></nav></header>
<main class="wrap" id="view"></main>

<script>window.IMG_BASE = "images/";</script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
