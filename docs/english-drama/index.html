<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14233A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어 드라마 B1">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>영어 드라마 B1</title>
<meta name="description" content="4컷 만화 연재로 배우는 비즈니스 영어 B1 — 시즌 1 알마티 CT 납품 대작전, 20화.">
<style>
@font-face{font-family:Plex;font-weight:400;src:url(fonts/latin-400.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2460-24FF,U+25A0-25FF}
@font-face{font-family:Plex;font-weight:600;src:url(fonts/latin-600.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2460-24FF,U+25A0-25FF}
@font-face{font-family:Plex;font-weight:700;src:url(fonts/latin-700.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2460-24FF,U+25A0-25FF}
@font-face{font-family:Plex;font-weight:400;src:url(fonts/kr-400.woff2) format("woff2")}
@font-face{font-family:Plex;font-weight:600;src:url(fonts/kr-600.woff2) format("woff2")}
@font-face{font-family:Plex;font-weight:700;src:url(fonts/kr-700.woff2) format("woff2")}
:root{
 --navy:#14233A; --paper:#FBF8F2; --card:#FFFFFF; --ink:#17202B; --muted:#4A5563; --line:#E3E6EA; --bubble:#F3F5F7;
 --accent:#E8833A; --red:#B5361F; --green:#1F6B43; --wa:#E7F6EF; --tip:#FFF6F1; --tipline:#F0D3C4;
 --s0:#0E6672; --s1:#2856A3; --s2:#B4501A; --s3:#6B3FA0;
 --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
 --paper:#0F1622; --card:#182231; --ink:#E8ECF2; --muted:#A3AEBD; --line:#2A3647; --bubble:#202C3D;
 --wa:#173328; --tip:#2A1E19; --tipline:#4A3328; --red:#F08A73; --green:#6FD19B;
 --s0:#4FB3BF; --s1:#7FA6E8; --s2:#E9915B; --s3:#B496E0;}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{font-family:Plex,-apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--paper);line-height:1.5;-webkit-text-size-adjust:100%;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(var(--safe-t) + 8px) 0 8px}
.bar .wrap{display:flex;align-items:center;gap:8px;min-height:40px}
.bar .t{flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;flex:none}
.ib:active{background:rgba(255,255,255,.12)}
.ib svg{width:22px;height:22px}
.pg{height:3px;background:rgba(255,255,255,.15);position:absolute;left:0;right:0;bottom:0}
.pg i{display:block;height:100%;background:var(--accent);width:0}
/* home */
.hero{background:var(--navy);color:#fff;padding:calc(var(--safe-t) + 22px) 0 22px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.12em;color:#8FD3C8}
.hero h1{font-size:27px;line-height:1.25;margin:6px 0 4px}
.hero p{color:#C9D3E0;font-size:14px}
.cover{margin-top:16px;border-radius:14px;overflow:hidden;background:#fff;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.cover img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.prog{margin-top:16px;display:flex;align-items:center;gap:10px;font-size:13px;color:#C9D3E0}
.prog .track{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--accent)}
.cta{margin-top:14px;width:100%;min-height:52px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:22px 0 10px;letter-spacing:.04em}
.cast{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cast::-webkit-scrollbar{display:none}
.cm{flex:none;display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;font-size:12.5px}
.cm b{font-weight:600}
.cm span.r{color:var(--muted)}
.dot{width:26px;height:26px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.eps{display:flex;flex-direction:column;gap:10px}
.ep{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;width:100%}
.ep img{width:84px;height:63px;border-radius:9px;object-fit:cover;flex:none;background:#fff}
.ep .meta{flex:1;min-width:0}
.ep .no{font-size:11.5px;font-weight:700;color:var(--accent)}
.ep .tt{font-weight:700;font-size:15.5px;line-height:1.3}
.ep .gr{font-size:12.5px;color:var(--muted)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--green);border-color:var(--green)}
.chk svg{width:14px;height:14px;display:none}.chk.on svg{display:block}
.foot{margin:26px 0 calc(var(--safe-b) + 30px);display:flex;flex-direction:column;gap:10px}
.lnk{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:14.5px;text-decoration:none;color:var(--ink);min-height:48px}
.lnk svg{width:20px;height:20px;flex:none}
.status{font-size:12.5px;color:var(--muted);text-align:center}
/* reader */
.head{padding:18px 0 4px}
.head .no{display:inline-block;background:var(--accent);color:#fff;font-weight:700;font-size:13px;border-radius:6px;padding:2px 9px}
.head h2{font-size:25px;line-height:1.25;margin:8px 0 4px}
.head .gr{font-size:13.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px}
.tools{display:flex;gap:8px;margin:14px 0 4px}
.tbtn{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.tbtn svg{width:18px;height:18px}
.tbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.panel{background:var(--card);border:2px solid var(--navy);border-radius:16px;overflow:hidden;margin-top:14px}
@media (prefers-color-scheme:dark){.panel{border-color:#3A4A62}}
.plabel{background:var(--navy);color:#fff;font-size:13px;font-weight:700;padding:6px 12px}
.pimg{width:100%;display:block;background:#fff;aspect-ratio:300/222;object-fit:cover}
.dlg{padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px}
.line{display:flex;gap:8px;align-items:flex-start}
.line .dot{margin-top:4px}
.bub{flex:1;background:var(--bubble);border-radius:4px 14px 14px 14px;padding:8px 11px;text-align:left;width:100%}
.en{font-size:16px;line-height:1.45;font-weight:500}
.ko{font-size:13.5px;color:var(--muted);margin-top:2px}
.hideko .ko{filter:blur(5px);opacity:.6}
.hideko .bub.peek .ko{filter:none;opacity:1}
.hl{font-weight:700;border-radius:4px;padding:0 3px}
.say{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px;color:var(--muted)}
.say svg{width:18px;height:18px}
.say.playing{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:16px}
.card h3{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card h3 svg{width:20px;height:20px;flex:none}
.wr{padding:8px 0;border-top:1px solid var(--line)}
.wr:first-of-type{border-top:0}
.wtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wtop b{font-size:17px}
.wtop span{font-size:12px;color:var(--muted);white-space:nowrap}
.wsub{font-size:13.5px;margin-top:2px}
.red{background:var(--tip);border-color:var(--tipline)}
.red h3{color:var(--red)}
.mail{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mhead{font-size:12px;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:4px}
.ml{font-size:15px;line-height:1.55;padding:6px 0}
.ml s{color:var(--red);opacity:.8}
.ml .fix{color:var(--red);font-weight:700;border-bottom:2px solid var(--red)}
.ml .why{display:block;font-size:12.5px;color:var(--muted)}
.mission{border:1.5px dashed #8A94A3}
.wa{background:var(--wa);border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:15px;max-width:92%}
.wa .who{font-size:12px;font-weight:700;color:var(--s0)}
.ctx{font-size:13.5px;color:var(--muted);margin:10px 0 4px}
.q{font-size:15.5px;line-height:1.9;padding:4px 0}
.q input{width:6.5em;max-width:40vw;border:0;border-bottom:2px solid var(--muted);background:transparent;color:var(--ink);font-size:16px;padding:0 4px;text-align:center;border-radius:0;outline:none}
.q input:focus{border-color:var(--accent)}
.q input.ok{border-color:var(--green);color:var(--green);font-weight:700}
.q input.no{border-color:var(--red);color:var(--red)}
.q .mu{color:var(--muted);font-size:13.5px}
.q .sol{display:block;font-size:13px;color:var(--green);line-height:1.4}
.row2{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;min-height:46px;border-radius:11px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{background:#2C4466}}
.btn.sec2{border:1px solid var(--line);background:var(--card)}
.score{font-size:14px;font-weight:700;margin-top:10px;text-align:center}
.done{margin-top:18px;min-height:54px;width:100%;border-radius:12px;font-weight:700;font-size:16px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.done.is{background:var(--card);color:var(--green);border:1.5px solid var(--green)}
.teaser{margin-top:14px;background:var(--navy);color:#fff;border-radius:14px;padding:14px;text-align:left;width:100%;display:block}
.teaser small{display:inline-block;background:var(--accent);border-radius:5px;padding:1px 8px;font-size:12px;font-weight:700;margin-bottom:6px}
.teaser div{font-size:14.5px;line-height:1.45}
.nav{display:flex;gap:8px;margin:14px 0 calc(var(--safe-b) + 28px)}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 18px calc(var(--safe-b) + 18px)}
.sheet h4{font-size:17px;margin-bottom:10px}
.opt{display:flex;align-items:center;justify-content:space-between;min-height:52px;border-top:1px solid var(--line);font-size:15px;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:8px 12px;font-size:14px}
.seg button.on{background:var(--navy);color:#fff}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--green)}.sw.on::after{left:23px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}
.tab{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}.tab.on{color:var(--navy)}
@media (prefers-color-scheme:dark){.tab.on{color:#8FD3C8}}
.hastabs{padding-bottom:calc(var(--safe-b) + 70px)}
/* deep */
.exw{padding:10px 0;border-top:1px solid var(--line)}.exw:first-of-type{border-top:0}
.exw .t{font-size:17px;font-weight:700}.exw .why{font-size:14px;margin:3px 0 6px}
.exw .e{font-size:14.5px;line-height:1.45;padding:6px 10px;background:var(--bubble);border-radius:8px;margin-top:5px;display:flex;gap:8px;align-items:flex-start}
.exw .e .say{width:30px;height:30px;margin:0}
.exw .e .k{display:block;font-size:12.5px;color:var(--muted)}
.exw .trap{font-size:12.5px;color:var(--red);margin-top:6px}
.tmail{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.6}
.tmail .sub{font-weight:700;border-bottom:1px dashed var(--line);padding-bottom:4px;margin-bottom:6px}
.tmail .hid{color:transparent;background:var(--line);border-radius:4px}
.rp{display:flex;gap:8px;align-items:flex-start;padding:5px 0}
.rp .bub{border-radius:12px}
.rp.me .bub{background:var(--wa)}
.qz{padding:10px 0;border-top:1px solid var(--line)}.qz:first-of-type{border-top:0}
.qz .qq{font-size:15px;font-weight:600;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:5px}
.opt2{min-height:42px;border:1px solid var(--line);border-radius:9px;padding:8px 12px;text-align:left;font-size:14.5px;background:var(--card);display:flex;align-items:center;gap:8px}
.opt2 i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;flex:none}
.opt2.pick{border-color:var(--navy)}.opt2.ok{border-color:var(--green);background:#E7F6EF;color:#14532d}.opt2.no{border-color:var(--red);background:#FDECEA;color:#7a1f10}
@media (prefers-color-scheme:dark){.opt2.ok{background:#173328;color:#9fe0b8}.opt2.no{background:#3a1f1a;color:#f3a08c}}
.qz .why2{font-size:13px;color:var(--muted);margin-top:5px;display:none}
.qz.answered .why2{display:block}
.acc{display:flex;align-items:center;justify-content:space-between;min-height:48px;width:100%;text-align:left;font-size:16px;font-weight:700}
.acc svg{width:20px;height:20px;transition:transform .15s}.acc.open svg{transform:rotate(180deg)}
.accbody{display:none;padding-top:8px}.accbody.open{display:block}
/* flashcards */
.fc{perspective:1000px;margin-top:14px}
.fcin{position:relative;min-height:230px;transform-style:preserve-3d;transition:transform .35s}
.fc.flip .fcin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.face.b{transform:rotateY(180deg)}
.face .w{font-size:26px;font-weight:700}.face .pos{font-size:12.5px;color:var(--muted)}.face .ko{font-size:22px;font-weight:700;color:var(--s0)}.face .ex{font-size:14.5px;color:var(--muted);line-height:1.45}
.face .tapme{position:absolute;bottom:10px;font-size:11.5px;color:var(--muted)}
.fcnav{display:flex;gap:8px;margin-top:12px}
.fcnav .btn{min-height:50px}
.know{background:var(--green);color:#fff}.dont{background:var(--red);color:#fff}
.filters{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.fl{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.fl.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.vlist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.vrow{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;text-align:left;width:100%}
.vrow .w{font-weight:700;font-size:15px}.vrow .ko{font-size:13px;color:var(--muted)}.vrow .ep{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.vrow .star{width:22px;height:22px;flex:none;color:var(--line)}.vrow.st .star{color:var(--accent)}
.search{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card);color:var(--ink);margin-top:12px;outline:none;font-size:15px}
/* review */
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.wk{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.wk.on{background:var(--green);color:#fff;border-color:var(--green)}
.tst{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%;text-align:left;margin-top:8px}
.tst .n{width:40px;height:40px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.tst .m{flex:1}.tst .tt{font-weight:700;font-size:15px}.tst .sub{font-size:12.5px;color:var(--muted)}
.tst .best{font-size:13px;font-weight:700;color:var(--green);white-space:nowrap}
.tbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0}.tbar i{display:block;height:100%;background:var(--accent)}
.result{text-align:center;padding:20px 0}.result b{font-size:42px;display:block}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 20px);transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet" id="sheet"><div class="in">
 <h4>읽기 설정</h4>
 <div class="opt"><span>한글 번역 보기<br><small style="color:var(--muted)">끄면 흐리게 가려지고, 말풍선을 누르면 보입니다</small></span><button class="sw" id="swKo" aria-label="한글 번역 보기"></button></div>
 <div class="opt"><span>읽어주기 속도</span><div class="seg" id="segRate"><button data-r="0.75">느리게</button><button data-r="0.9">보통</button><button data-r="1.05">빠르게</button></div></div>
 <div class="opt"><span>진도 초기화</span><button class="tbtn" id="reset" style="flex:none;padding:0 14px">초기화</button></div>
 <button class="btn pri" style="width:100%;margin-top:12px" id="closeSheet">닫기</button>
</div></div>

<script>

  if(i>=qs.length){if(idx>=0){const t=S.tests[idx]||{best:0,n:0};t.n++;t.best=Math.max(t.best,ok);S.tests[idx]=t;save()}
   const pct=Math.round(ok/qs.length*100);
   app.innerHTML=`<div class="bar"><div class="wrap"><button class="ib" id="back">${IC.back}</button><div class="t">${title}</div></div></div><main class="wrap"><div class="result"><b style="color:${pct>=80?"var(--green)":pct>=60?"var(--accent)":"var(--red)"}">${ok} / ${qs.length}</b><div>${pct>=90?"완벽합니다! 다음 단원으로 가세요.":pct>=70?"잘했어요. 틀린 문제만 오답 노트에서 다시 보세요.":"해당 화의 표현 설명을 한 번 더 읽고 다시 도전하세요."}</div></div>
   <div class="row2"><button class="btn sec2" id="again">다시</button><button class="btn pri" id="back2">복습으로</button></div></main>`;
   $("#back").onclick=$("#back2").onclick=()=>review();$("#again").onclick=()=>test(idx,shuffle(qs));return}
  const q=qs[i];
  app.innerHTML=`<div class="bar"><div class="wrap"><button class="ib" id="back">${IC.back}</button><div class="t">${title}</div><span style="font-size:13px;color:#C9D3E0">${i+1}/${qs.length}</span></div></div>
  <main class="wrap"><div class="tbar"><i style="width:${i/qs.length*100}%"></i></div>
   <div class="card qz"><div class="sub" style="font-size:12px;color:var(--muted);margin-bottom:4px">EP.${q.ep} · ${esc(DATA.eps.find(e=>e.no===q.ep).grammar)}</div><div class="qq" style="font-size:17px">${esc(q.q)}</div>
   <div class="opts">${q.opts.map((o,j)=>`<button class="opt2" data-j="${j}" style="min-height:48px"><i>${"ABCD"[j]}</i><span>${esc(o)}</span></button>`).join("")}</div><div class="why2">✎ ${esc(q.why)}</div></div>
   <button class="btn pri" id="next" style="display:none;width:100%;margin-top:12px">다음 →</button></main>`;
  $("#back").onclick=()=>review();
  app.querySelectorAll(".opt2").forEach(o=>o.onclick=()=>{if(app.querySelector(".qz.answered"))return;const j=+o.dataset.j;const z=app.querySelector(".qz");z.classList.add("answered");
   z.querySelectorAll(".opt2").forEach(b=>{const k=+b.dataset.j;b.classList.toggle("ok",k===q.a);b.classList.toggle("no",k===j&&j!==q.a)});
   if(j===q.a){ok++;S.wrong=S.wrong.filter(k=>k!==q.key)}else if(!S.wrong.includes(q.key))S.wrong.push(q.key);save();
   const n=$("#next");n.style.display="flex";n.textContent=i===qs.length-1?"결과 보기":"다음 →";n.onclick=()=>{i++;show()};n.focus()});
  window.scrollTo(0,0);
 };show();
}
/* router */
function route(){const h=location.hash;const m=h.match(/#\/ep\/(\d+)/);if(m)reader(m[1]);else if(h.startsWith("#/words"))words();else if(h.startsWith("#/review"))review();else home()}
window.addEventListener("hashchange",route);
route();

/* offline */
async function checkOffline(){
 const el=$("#offline");if(!el)return;
 if(!("serviceWorker" in navigator)||!("caches" in window)){el.textContent="이 브라우저는 오프라인 저장을 지원하지 않습니다";return}
 try{const c=await caches.open("ed1-"+VERSION);const n=(await c.keys()).length;const need=DATA.precacheCount;
  el.textContent=n>=need?"✓ 오프라인 사용 준비 완료 · 인터넷 없이도 열립니다":`오프라인 저장 중… ${n}/${need}`;
  if(n<need)setTimeout(checkOffline,1500)}catch(e){el.textContent=""}
}
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").then(r=>{const ask=()=>r.active&&r.active.postMessage("ensure");ask();navigator.serviceWorker.ready.then(ask)}).catch(()=>{})});
 let had=!!navigator.serviceWorker.controller,rl=false;
 navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!rl){rl=true;toast("새 버전으로 업데이트되었습니다")}had=true});
}
</script>
