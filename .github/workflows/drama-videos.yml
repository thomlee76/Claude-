name: drama-videos
on:
  push:
    branches: [claude/english-learning-app-3ufdp7]
    paths: ['drama-video/request.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: drama-videos
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts playwright
          python -m playwright install --with-deps chromium
      - name: Render frames
        run: python drama-video/render.py $(cat drama-video/request.txt)
      - name: Narrate and encode
        run: python drama-video/build.py $(cat drama-video/request.txt)
      - name: Commit videos
        run: |
          git config user.name "video-builder"
          git config user.email "actions@users.noreply.github.com"
          git add docs/english-drama/video/*.mp4
          git commit -m "build: drama episode videos [skip ci]" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done
