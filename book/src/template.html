<title>Claude в работе</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Практическое руководство по Claude для руководителя зарубежных продаж: модели, Cowork, Skills, коннекторы, Claude Code, агенты и презентации.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
<style>
/* Layout: two-column field manual — sticky contents rail on the left, ~70ch reading column, figure plates break out wider. */
:root{
  --paper:#F5F6F3; --surface:#FFFFFF; --ink:#18222B; --muted:#5A6570; --rule:#DCE0DC;
  --accent:#AE4C29; --accent-soft:#F4E4DB; --teal:#1C5B5F; --teal-soft:#DFEBEA;
  --amber:#8A5A0B; --amber-soft:#F5ECD6; --warn:#9A3B2E; --warn-soft:#F6E1DC;
  --ok:#2E6B45; --ok-soft:#E0EFE5; --code:#EDF0EC; --shadow:0 1px 2px rgba(24,34,43,.06),0 8px 24px rgba(24,34,43,.06);
  --display:"Literata",Georgia,"Times New Roman",serif;
  --body:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --rail:288px; --measure:44rem; --plate:58rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111518; --surface:#192024; --ink:#E3E7E9; --muted:#9BA6AE; --rule:#2A3237;
  --accent:#E2906A; --accent-soft:#3A2820; --teal:#86C9C6; --teal-soft:#183032;
  --amber:#E2B865; --amber-soft:#332917; --warn:#EE9A8A; --warn-soft:#3A2321;
  --ok:#8FD1A6; --ok-soft:#173022; --code:#0E1215; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111518; --surface:#192024; --ink:#E3E7E9; --muted:#9BA6AE; --rule:#2A3237;
  --accent:#E2906A; --accent-soft:#3A2820; --teal:#86C9C6; --teal-soft:#183032;
  --amber:#E2B865; --amber-soft:#332917; --warn:#EE9A8A; --warn-soft:#3A2321;
  --ok:#8FD1A6; --ok-soft:#173022; --code:#0E1215; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--paper);color:var(--ink);font:400 17px/1.65 var(--body);-webkit-text-size-adjust:100%;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
a{color:var(--teal);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--rule);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px}
.brand{font:700 18px/1 var(--display);color:var(--ink);text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:10px}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--surface);display:grid;place-items:center;font:700 15px/1 var(--body)}
.search{position:relative;flex:1;max-width:460px;margin-left:auto}
.search input{width:100%;font:500 15px/1 var(--body);padding:10px 12px 10px 36px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);max-height:min(70vh,520px);overflow:auto;padding:6px}
.results a{display:block;padding:10px 12px;border-radius:8px;color:var(--ink);text-decoration:none}
.results a:hover,.results a.sel{background:var(--paper)}
.results .r-ch{font:600 12px/1.2 var(--body);color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.results .r-t{font:600 15px/1.35 var(--body);margin:3px 0}
.results .r-s{font-size:13.5px;line-height:1.45;color:var(--muted)}
.results mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px}
.results .empty{padding:14px;color:var(--muted);font-size:14px}
.iconbtn{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{border-color:var(--muted)}
#menuBtn{display:none}
.progress{position:absolute;left:0;bottom:-1px;height:3px;background:var(--accent);width:0;transition:width .1s linear}

/* layout */
.layout{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:0}
.toc{position:sticky;top:calc(61px + env(safe-area-inset-top,0px));height:calc(100vh - 61px - env(safe-area-inset-top,0px));overflow:auto;border-right:1px solid var(--rule);
  padding:22px 18px 40px max(18px,env(safe-area-inset-left,0px));background:var(--paper)}
.toc h4{font:600 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.toc ol{list-style:none;margin:0;padding:0}
.toc > ol > li{margin-bottom:2px}
.toc a{display:flex;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.35}
.toc a:hover{background:var(--surface)}
.toc .n{flex:none;width:22px;font:600 13px/1.5 var(--mono);color:var(--muted)}
.toc li.active > a{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.toc li.active > a .n{color:var(--accent)}
.toc li.done > a .n::after{content:" ✓";color:var(--ok)}
.toc ol ol{margin:2px 0 8px 32px;border-left:1px solid var(--rule);display:none}
.toc li.active ol{display:block}
.toc ol ol a{font-size:13.5px;padding:5px 10px;color:var(--muted)}
.toc ol ol a.cur{color:var(--ink);font-weight:600}
main{min-width:0;padding-block:28px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:var(--plate);margin:0 auto}
.page > section > *:not(figure):not(.wide){max-width:var(--measure)}

/* cover */
.cover{padding:40px 0 34px;border-bottom:1px solid var(--rule);margin-bottom:24px}
.eyebrow{font:600 13px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.cover h1{font:700 clamp(40px,7vw,72px)/1.02 var(--display);letter-spacing:-.02em;margin:14px 0 14px;text-wrap:balance}
.cover .sub{font:400 clamp(18px,2.4vw,22px)/1.45 var(--display);color:var(--muted);max-width:40rem;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin:26px 0 0;padding:0;list-style:none;font:500 14px/1.3 var(--body);color:var(--muted)}
.facts b{font:700 22px/1 var(--display);color:var(--ink);margin-right:6px;font-variant-numeric:tabular-nums}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:30px 0 0}
.chapters a{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:16px 18px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s}
.chapters a:hover{border-color:var(--accent);transform:translateY(-1px)}
.chapters .cn{grid-row:span 2;font:700 34px/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.chapters .ct{font:600 16px/1.3 var(--body)}
.chapters .cd{font-size:13.5px;line-height:1.45;color:var(--muted)}

/* chapter */
.chapter{padding-top:34px;margin-top:34px;border-top:1px solid var(--rule)}
.chapter:first-of-type{border-top:0;margin-top:0}
.ch-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.ch-num{font:600 13px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.ch-meta{font:500 13px/1 var(--body);color:var(--muted)}
.chapter h2{font:700 clamp(30px,4.4vw,44px)/1.12 var(--display);letter-spacing:-.015em;margin:8px 0 18px;text-wrap:balance}
.chapter h3{font:700 clamp(22px,2.6vw,27px)/1.25 var(--display);margin:46px 0 12px;text-wrap:balance}
.chapter h4{font:600 18px/1.35 var(--body);margin:26px 0 8px}
.lead{font:400 19.5px/1.6 var(--display);color:var(--ink);border-left:3px solid var(--accent);padding-left:18px;margin:0 0 22px}
p{margin:0 0 14px}
ul,ol{padding-left:1.35em;margin:0 0 16px}
li{margin:4px 0}
li::marker{color:var(--muted)}
code,kbd{font:500 .86em/1.4 var(--mono);background:var(--code);padding:.1em .38em;border-radius:5px;border:1px solid var(--rule)}
kbd{border-bottom-width:2px}
strong{font-weight:600}
em{font-style:normal;font-weight:500;color:var(--teal)}

pre{font:400 13.5px/1.6 var(--mono);background:var(--code);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:16px 0 20px;max-width:var(--measure)}
/* steps */
ol.steps{list-style:none;padding:0;counter-reset:st;display:grid;gap:10px;margin:14px 0 22px}
ol.steps > li{counter-increment:st;position:relative;padding:12px 16px 12px 56px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;margin:0}
ol.steps > li::before{content:counter(st);position:absolute;left:14px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:600 14px/1 var(--mono)}

/* callouts */
.callout{border-radius:12px;padding:14px 18px;margin:18px 0;background:var(--teal-soft);border:1px solid transparent}
.callout p:last-child,.callout ul:last-child{margin-bottom:0}
.callout.tip{background:var(--ok-soft)}
.callout.tip strong:first-child{color:var(--ok)}
.callout.warn{background:var(--warn-soft)}
.callout.warn strong:first-child{color:var(--warn)}
.callout.note{background:var(--amber-soft)}
.callout.note strong:first-child{color:var(--amber)}
.callout.example{background:var(--surface);border-color:var(--rule);border-left:3px solid var(--teal);border-radius:4px 12px 12px 4px}
.callout.example strong:first-child{color:var(--teal)}

/* tables */
.tw{overflow-x:auto;margin:18px 0 22px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);max-width:var(--plate)!important}
table.t{border-collapse:collapse;width:100%;font-size:15px;line-height:1.45}
table.t th{font:600 13px/1.3 var(--body);text-align:left;letter-spacing:.03em;color:var(--muted);background:var(--paper);padding:11px 14px;border-bottom:1px solid var(--rule);white-space:nowrap}
table.t td{padding:11px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td:first-child{font-weight:600}
table.t td{font-variant-numeric:tabular-nums}

/* prompts */
.prompt{margin:18px 0 22px;border-radius:12px;border:1px solid var(--rule);background:var(--surface);overflow:hidden;max-width:var(--measure)}
.prompt-h{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 16px;background:var(--paper);border-bottom:1px solid var(--rule)}
.prompt-h .lbl{font:600 11.5px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);flex:none}
.prompt-h .ttl{font:600 14.5px/1.3 var(--body);flex:1;min-width:0}
.copy{flex:none;font:600 13px/1 var(--body);padding:8px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer}
.copy:hover{border-color:var(--accent);color:var(--accent)}
.copy.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.prompt pre{background:none;border:0;border-radius:0;max-width:none;margin:0;padding:14px 16px;font:400 14px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;overflow-x:auto;color:var(--ink)}

/* figures */
figure.fig{margin:28px 0 30px;max-width:var(--plate)}
figure.fig button{all:unset;display:block;cursor:zoom-in;border-radius:14px;overflow:hidden;border:1px solid var(--rule);box-shadow:var(--shadow);background:#FAF7F2;width:100%;box-sizing:border-box}
figure.fig button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
figure.fig img{display:block;width:100%;height:auto;aspect-ratio:1800/1140}
figcaption{font-size:14.5px;line-height:1.5;color:var(--muted);margin-top:10px;max-width:var(--measure)}
figcaption .fn{font-weight:600;color:var(--ink)}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(10,14,17,.86);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lightbox img{max-width:min(1800px,100%);max-height:100%;border-radius:10px;background:#FAF7F2}
.lightbox .close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));background:var(--surface)}

/* checklist & quiz */
.checklist{margin:30px 0 20px;padding:18px 20px;border-radius:14px;background:var(--surface);border:1px solid var(--rule)}
.checklist h4{margin:0 0 10px;font:700 20px/1.3 var(--display)}
.checklist ul{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.checklist li{margin:0}
.checklist label{display:flex;gap:12px;align-items:flex-start;padding:7px 6px;border-radius:8px;cursor:pointer}
.checklist label:hover{background:var(--paper)}
.checklist input{flex:none;width:19px;height:19px;margin-top:3px;accent-color:var(--ok)}
.checklist input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}
.cl-count{font:600 13px/1 var(--body);color:var(--muted);margin-left:8px}
.quiz{margin:16px 0;padding:16px 18px;border-radius:14px;border:1px solid var(--rule);background:var(--surface)}
.quiz-tag{font:600 11.5px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:8px}
.quiz .q{font-weight:600;margin-bottom:10px}
.quiz ol{list-style:none;padding:0;margin:0 0 4px;display:grid;gap:8px}
.quiz li{margin:0}
.quiz li button{all:unset;box-sizing:border-box;display:block;width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;line-height:1.45}
.quiz li button:hover{border-color:var(--muted)}
.quiz li button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.quiz li.right button{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.quiz li.wrong button{background:var(--warn-soft);border-color:var(--warn)}
.quiz .explain{margin:10px 0 0;font-size:15px;color:var(--muted)}
.quiz:not(.answered) .explain{display:none}

/* glossary & library */
dl.gloss{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:0;border-top:1px solid var(--rule);max-width:var(--plate)!important}
dl.gloss dt,dl.gloss dd{padding:12px 0;border-bottom:1px solid var(--rule);margin:0}
dl.gloss dt{font-weight:600;padding-right:18px}
.lib-bar{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px;max-width:var(--plate)!important}
.chip{font:600 13.5px/1 var(--body);padding:9px 13px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.lib-count{font-size:14px;color:var(--muted);margin-bottom:6px}
.lib .prompt{max-width:var(--plate)}
.lib .src{font:500 12.5px/1 var(--body);color:var(--muted);padding:0 16px 12px}
.lib .src a{color:var(--muted)}
.foot{margin-top:60px;padding-top:18px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--muted)}

/* responsive */
@media (max-width:960px){
  .layout{grid-template-columns:minmax(0,1fr)}
  #menuBtn{display:grid}
  .toc{position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(86vw,330px);height:auto;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow);background:var(--surface);
    padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
  .toc.open{transform:none}
  .brand span.full{display:none}
  dl.gloss{grid-template-columns:1fr}
  dl.gloss dt{border-bottom:0;padding-bottom:0}
}
@media (max-width:520px){body{font-size:16px}.lead{font-size:18px}.prompt pre{font-size:13px}.brand span{display:none}}


.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:10px;width:min(560px,calc(100vw - 32px));
  background:var(--ink);color:var(--surface);border-radius:14px;padding:10px 10px 10px 16px;box-shadow:var(--shadow);font-size:14.5px;line-height:1.35}
.toast b{font-weight:600}
.toast .t-txt{flex:1;min-width:0}
.toast button{flex:none;font:600 13.5px/1 var(--body);border:0;border-radius:9px;padding:9px 12px;cursor:pointer;background:var(--surface);color:var(--ink)}
.toast button.ghost{background:transparent;color:var(--surface);opacity:.75;padding:9px 6px}
.cover .dl{display:inline-flex;align-items:center;gap:8px;margin-top:20px;font:600 14.5px/1 var(--body);color:var(--surface);background:var(--ink);padding:11px 16px;border-radius:10px;text-decoration:none}
@media print{.toast{display:none!important}}
.offline{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:20px}
.offline .dl{margin-top:0}
.off-st{display:inline-flex;align-items:center;gap:8px;font:600 14px/1.2 var(--body);padding:9px 13px;border-radius:999px;background:var(--amber-soft);color:var(--amber)}
.off-st.ok{background:var(--ok-soft);color:var(--ok)}
.off-st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.off-pdf{font:600 13.5px/1 var(--body);padding:10px 13px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer}
@media print{.offline{display:none!important}}
/* print / PDF */
@page{size:A4;margin:13mm 13mm 15mm}
@media print{
  :root{--paper:#fff;--surface:#fff}
  body{font-size:9.6pt;line-height:1.42;background:#fff}
  .topbar,.toc,.copy,.lightbox,.lib-bar,.iconbtn,.cl-count,#library,.chapters{display:none!important}
  .layout{display:block} main{padding:0}
  .page,.page > section > *{max-width:none!important}
  .chapter{break-before:page;border-top:0;margin-top:0;padding-top:0}
  .chapter h2{font-size:22pt;margin:4pt 0 10pt}
  .chapter h3{font-size:14pt;margin:16pt 0 6pt}
  .chapter h4{font-size:11pt;margin:10pt 0 4pt}
  p{margin:0 0 6pt} li{margin:1pt 0} ul,ol{margin:0 0 7pt}
  .lead{font-size:11pt;margin-bottom:10pt}
  .cover{break-after:page;border:0;padding-top:40mm}
  .cover h1{font-size:44pt}
  figure.fig{break-inside:avoid;margin:8pt auto 10pt;width:86%}
  figure.fig button{box-shadow:none;border-radius:6px}
  figcaption{font-size:8.6pt;margin-top:4pt;max-width:none}
  .prompt{margin:8pt 0 10pt}
  .prompt-h{padding:4pt 8pt}
  .prompt pre{font-size:8.4pt;line-height:1.45;padding:6pt 9pt}
  pre{font-size:8.2pt;padding:6pt 9pt;margin:6pt 0 8pt}
  .callout{padding:6pt 10pt;margin:8pt 0}
  ol.steps{gap:4pt;margin:6pt 0 10pt} ol.steps > li{padding:5pt 8pt 5pt 30pt} ol.steps > li::before{left:8pt;top:5pt;width:16pt;height:16pt;font-size:8pt}
  .tw{margin:8pt 0 10pt} table.t{font-size:8.6pt} table.t th,table.t td{padding:4pt 7pt} table.t th{font-size:8pt}
  .checklist{padding:8pt 10pt;margin:12pt 0 8pt} .checklist label{padding:1pt 2pt}
  .quiz{padding:7pt 10pt;margin:6pt 0} .quiz ol{gap:3pt} .quiz li button{padding:3pt 8pt}
  .prompt,.callout,ol.steps > li,.quiz,table.t tr{break-inside:avoid}
  h3,h4{break-after:avoid}
  .quiz .explain{display:block!important;font-size:8.8pt}
  .quiz li[data-correct] button{border-color:var(--ok)}
  a{color:inherit;text-decoration:none}
  .foot{margin-top:20pt}
}
</style>

<header class="topbar">
  <button class="iconbtn" id="menuBtn" aria-label="Содержание" aria-controls="toc" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  <a class="brand" href="#top"><span class="brand-mark" aria-hidden="true"><svg width="18" height="18" viewBox="80 110 352 300"><rect x="96" y="176" width="320" height="220" rx="34" fill="currentColor"/><path d="M196 176v-26c0-16 12-28 28-28h64c16 0 28 12 28 28v26" fill="none" stroke="currentColor" stroke-width="26"/><g transform="translate(256 300)" stroke="var(--accent)" stroke-width="22" stroke-linecap="round"><path d="M0-48V48M-48 0H48M-34-34L34 34M34-34L-34 34"/></g></svg></span><span>Claude <span class="full">в работе</span></span></a>
  <div class="search" role="search">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
    <input id="q" type="search" placeholder="Поиск: «Gmail», «отчёт», «Effort»…" autocomplete="off" aria-label="Поиск по книге">
    <div class="results" id="results" hidden></div>
  </div>
  <button class="iconbtn" id="themeBtn" aria-label="Сменить тему"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
  <div class="progress" id="progress"></div>
</header>

<div class="layout">
<nav class="toc" id="toc" aria-label="Содержание">
<h4>Содержание</h4>
{{TOC}}
</nav>
<main id="top">
<div class="page">
{{COVER}}
{{CONTENT}}
<p class="foot">Claude в работе · практическое руководство для отдела зарубежных продаж · актуально на 16 октября 2026 года. Иллюстрации нарисованы в Figma, факты сверены с официальной документацией Anthropic.</p>
</div>
</main>
</div>
<div class="toast" id="toast" hidden><span class="t-txt" id="toastTxt"></span><button type="button" id="toastGo">Продолжить</button><button type="button" class="ghost" id="toastX" aria-label="Закрыть">✕</button></div>
<div class="lightbox" id="lightbox" hidden><img id="lbImg" alt=""><button class="iconbtn close" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const store={get(k){try{return JSON.parse(localStorage.getItem('cvr:'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('cvr:'+k,JSON.stringify(v))}catch(e){}}};

/* theme */
const t=store.get('theme'); if(t) document.documentElement.setAttribute('data-theme',t);
$('#themeBtn').addEventListener('click',()=>{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nx);store.set('theme',nx);});

/* prompts: header + copy */
function copyText(text,btn){const done=()=>{btn.textContent='Скопировано';btn.classList.add('ok');setTimeout(()=>{btn.textContent='Копировать';btn.classList.remove('ok')},1600)};
  const fallback=()=>{const pre=btn.closest('.prompt').querySelector('pre');const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Выделено — нажмите Ctrl+C';};
  try{navigator.clipboard.writeText(text).then(done,fallback)}catch(e){fallback()}}
function decoratePrompt(p){if(p.querySelector('.prompt-h'))return;const h=document.createElement('div');h.className='prompt-h';
  h.innerHTML='<span class="lbl">Промпт</span><span class="ttl"></span><button class="copy" type="button">Копировать</button>';
  h.querySelector('.ttl').textContent=p.dataset.title||'';p.prepend(h);
  h.querySelector('.copy').addEventListener('click',e=>copyText(p.querySelector('pre').innerText,e.currentTarget));}
$$('.chapter .prompt').forEach(decoratePrompt);

/* tables: scroll wrappers */
$$('table.t').forEach(tb=>{if(tb.parentElement.classList.contains('tw'))return;const w=document.createElement('div');w.className='tw';tb.parentNode.insertBefore(w,tb);w.appendChild(tb);});

/* checklists */
$$('.checklist').forEach((cl,ci)=>{const ch=cl.closest('.chapter').id;const key='cl:'+ch;const saved=store.get(key)||[];const items=$$('li',cl);
  const h=$('h4',cl);const cnt=document.createElement('span');cnt.className='cl-count';h&&h.appendChild(cnt);
  const upd=()=>{const n=$$('input:checked',cl).length;cnt.textContent=n+' из '+items.length;if(n===items.length)markDone(ch);};
  items.forEach((li,i)=>{const lab=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.id='cb-'+ch+'-'+i;cb.checked=!!saved[i];
    const sp=document.createElement('span');while(li.firstChild)sp.appendChild(li.firstChild);lab.append(cb,sp);li.appendChild(lab);
    cb.addEventListener('change',()=>{const st=items.map(x=>x.querySelector('input').checked);store.set(key,st);upd();});});upd();});
function markDone(ch){const d=store.get('done')||{};d[ch]=1;store.set('done',d);const li=$('#toc li[data-ch="'+ch+'"]');li&&li.classList.add('done');}
const done=store.get('done')||{};Object.keys(done).forEach(ch=>{const li=$('#toc li[data-ch="'+ch+'"]');li&&li.classList.add('done')});

/* quiz */
$$('.quiz').forEach((qz,qi)=>{const tag=document.createElement('div');tag.className='quiz-tag';tag.textContent='Проверьте себя';qz.prepend(tag);
  const ol=$('ol',qz);if(ol&&!matchMedia('print').matches){const li=$$(':scope > li',ol);for(let i=li.length-1;i>0;i--){const j=(qi*7+i*3)%(i+1);[li[i],li[j]]=[li[j],li[i]];}li.forEach(x=>ol.appendChild(x));}
  $$('ol > li',qz).forEach(li=>{const b=document.createElement('button');b.type='button';while(li.firstChild)b.appendChild(li.firstChild);li.appendChild(b);
    b.addEventListener('click',()=>{if(qz.classList.contains('answered'))return;qz.classList.add('answered');li.classList.add(li.hasAttribute('data-correct')?'right':'wrong');
      const c=$('li[data-correct]',qz);c&&c.classList.add('right');});});});

/* lightbox */
const lb=$('#lightbox'),lbi=$('#lbImg');
$$('figure.fig button').forEach(b=>b.addEventListener('click',()=>{const im=b.querySelector('img');lbi.src=im.src;lbi.alt=im.alt;lb.hidden=false;$('.close',lb).focus();}));
lb.addEventListener('click',()=>{lb.hidden=true});
addEventListener('keydown',e=>{if(e.key==='Escape'){lb.hidden=true;closeToc();hideRes();}});

/* prompt library */
const lib=$('#lib-list');
if(lib){const all=$$('.chapter:not(.appendix) .prompt');const chips=$('#lib-bar');const chaps=[...new Set(all.map(p=>p.closest('.chapter').id))];
  const mk=(id,label)=>{const b=document.createElement('button');b.className='chip';b.type='button';b.dataset.ch=id;b.textContent=label;b.setAttribute('aria-pressed',id==='all'?'true':'false');chips.appendChild(b);return b;};
  mk('all','Все разделы');chaps.forEach(id=>{const s=document.getElementById(id);mk(id,s.dataset.num+'. '+s.dataset.title);});
  all.forEach((p,i)=>{const c=p.cloneNode(true);c.querySelector('.prompt-h')&&c.querySelector('.prompt-h').remove();c.removeAttribute('id');const ch=p.closest('.chapter');c.dataset.ch=ch.id;
    if(!p.id)p.id='pr-'+i;const src=document.createElement('div');src.className='src';src.innerHTML='Раздел '+ch.dataset.num+' · <a href="#'+p.id+'">открыть в тексте</a>';c.appendChild(src);lib.appendChild(c);decoratePrompt(c);});
  const cnt=$('#lib-count');const show=id=>{let n=0;$$('.prompt',lib).forEach(p=>{const on=id==='all'||p.dataset.ch===id;p.hidden=!on;if(on)n++;});cnt.textContent='Промптов: '+n;
    $$('.chip',chips).forEach(b=>b.setAttribute('aria-pressed',b.dataset.ch===id?'true':'false'));};
  chips.addEventListener('click',e=>{const b=e.target.closest('.chip');b&&show(b.dataset.ch)});show('all');}

/* TOC drawer */
const toc=$('#toc'),mb=$('#menuBtn');
function closeToc(){toc.classList.remove('open');mb.setAttribute('aria-expanded','false')}
mb.addEventListener('click',()=>{const o=toc.classList.toggle('open');mb.setAttribute('aria-expanded',o?'true':'false')});
toc.addEventListener('click',e=>{if(e.target.closest('a')&&innerWidth<=960)closeToc()});

/* scroll spy + progress */
const heads=$$('.chapter h2, .chapter h3');const prog=$('#progress');let ticking=false;
function spy(){ticking=false;const y=scrollY+120;let cur=null;for(const h of heads){if(h.getBoundingClientRect().top+scrollY<=y)cur=h;else break;}
  const max=document.documentElement.scrollHeight-innerHeight;prog.style.width=(max>0?Math.min(100,scrollY/max*100):0)+'%';
  $$('#toc li.active').forEach(l=>l.classList.remove('active'));$$('#toc a.cur').forEach(a=>a.classList.remove('cur'));
  if(!cur)return;const ch=cur.closest('.chapter');const li=$('#toc li[data-ch="'+ch.id+'"]');if(li){li.classList.add('active');}
  if(cur.tagName==='H3'&&cur.id){const a=$('#toc a[href="#'+cur.id+'"]');a&&a.classList.add('cur');}}
addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(spy)}},{passive:true});spy();

/* search */
const idx=[];$$('.chapter').forEach(ch=>{let cur={ch,title:$('h2',ch).textContent,id:ch.id,text:''};idx.push(cur);
  Array.from(ch.children).forEach(el=>{if(el.tagName==='H3'){cur={ch,title:el.textContent,id:el.id,text:''};idx.push(cur);}else if(!el.matches('figure')){cur.text+=' '+el.textContent;}});
  $$('figure.fig figcaption',ch).forEach(fc=>idx.push({ch,title:fc.querySelector('.fn').textContent+' '+(fc.closest('figure').querySelector('img').alt),id:fc.closest('figure').id,text:fc.textContent}));});
const q=$('#q'),res=$('#results');let sel=-1;
const norm=s=>s.toLowerCase().replace(/ё/g,'е');
function hideRes(){res.hidden=true;sel=-1}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function run(){const v=norm(q.value.trim());if(v.length<2){hideRes();return;}const words=v.split(/\s+/).filter(Boolean);const out=[];
  for(const e of idx){const T=norm(e.title),X=norm(e.text);if(!words.every(w=>T.includes(w)||X.includes(w)))continue;let score=words.reduce((a,w)=>a+(T.includes(w)?5:0)+(X.split(w).length-1),0);out.push([score,e]);}
  out.sort((a,b)=>b[0]-a[0]);const top=out.slice(0,12);
  if(!top.length){res.innerHTML='<div class="empty">Ничего не найдено. Попробуйте другое слово, например «календарь» или «PDF».</div>';res.hidden=false;return;}
  const hl=s=>{let h=esc(s);words.forEach(w=>{h=h.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')});return h;};
  res.innerHTML=top.map(([s,e])=>{const X=e.text.replace(/\s+/g,' ');const p=norm(X).indexOf(words[0]);const sn=p<0?X.slice(0,140):(p>50?'…':'')+X.slice(Math.max(0,p-50),p+110)+'…';
    return '<a href="#'+e.id+'"><div class="r-ch">'+(e.ch.dataset.num.length<3?'Раздел '+e.ch.dataset.num+' · ':'')+esc(e.ch.dataset.title)+'</div><div class="r-t">'+hl(e.title)+'</div><div class="r-s">'+hl(sn)+'</div></a>';}).join('');res.hidden=false;sel=-1;}
q.addEventListener('input',run);q.addEventListener('focus',run);
q.addEventListener('keydown',e=>{const items=$$('a',res);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((a,i)=>a.classList.toggle('sel',i===sel));}
  else if(e.key==='Enter'&&items.length){(items[sel]||items[0]).click();}});
res.addEventListener('click',e=>{if(e.target.closest('a')){hideRes();q.blur();}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))hideRes();});

/* продолжить чтение + подсказка установки */
const toastEl=$('#toast'),toastTxt=$('#toastTxt'),toastGo=$('#toastGo');let toastAct=null;
function toast(html,btn,act){toastTxt.innerHTML=html;toastGo.textContent=btn;toastGo.hidden=!btn;toastAct=act;toastEl.hidden=false;}
toastGo.addEventListener('click',()=>{toastEl.hidden=true;toastAct&&toastAct();});$('#toastX').addEventListener('click',()=>{toastEl.hidden=true;if(toastAct===null)store.set('hintDone',1);});
let saveT=0;addEventListener('scroll',()=>{clearTimeout(saveT);saveT=setTimeout(()=>{const a=$('#toc a.cur')||$('#toc li.active > a');if(a&&scrollY>600)store.set('last',a.getAttribute('href'));},600);},{passive:true});
const last=store.get('last');
if(last&&!location.hash&&document.querySelector(last)){const el=document.querySelector(last);const ch=el.closest('.chapter');
  toast('Продолжить с места, где вы остановились: <b>'+esc((ch&&ch.id!==el.id?('Раздел '+ch.dataset.num+' · '):'')+el.textContent)+'</b>','Продолжить',()=>el.scrollIntoView());}
else{const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  if(ios&&!standalone&&window.self===window.top&&location.protocol==='https:'&&!store.get('hintDone'))
    toast('Установите книгу как приложение: нажмите <b>Поделиться</b> внизу Safari, затем <b>На экран «Домой»</b>. Книга будет работать и без интернета.','',null);}
})();
</script>
